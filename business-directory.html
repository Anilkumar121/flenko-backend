<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Verified Suppliers, Manufacturers & Business Directory - Flenko B2B</title>
  <meta name="description" content="Search verified manufacturers, verified factories, OEM/ODM exporters, and wholesale distributors across 190+ countries categorized by industrial sector on Flenko.">
  <meta name="keywords" content="b2b business directory, verified suppliers india, factory directory, wholesale manufacturer listings, exporter directory, global trade suppliers">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <meta name="geo.placename" content="India">

  <meta name="rating" content="general">
  <meta name="author" content="Flenko.com">

  <!-- OpenGraph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Global Verified Suppliers & Business Directory - Flenko B2B">
  <meta property="og:description" content="Connect with verified global manufacturers, exporters, and wholesale distributors across 190+ countries categorized by business sectors.">
  <meta property="og:url" content="https://flenko.com/business-directory.html">
  <meta property="og:site_name" content="Flenko">

  <!-- Twitter Card Meta Tags -->

  <meta name="twitter:title" content="Verified Suppliers & Manufacturers Directory - Flenko B2B">
  <meta name="twitter:description" content="Find certified manufacturers, factory audits, and reliable wholesale exporters on Flenko.">
  <meta name="twitter:image" content="https://flenko.com/assets/images/logo.png">

  <!-- BreadcrumbList Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://flenko.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Supplier & Business Directory",

      }
    ]

  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/storefront.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    .supplier-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    .supplier-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--color-flenko-orange);
      transform: translateY(-2px);
    }
    .supplier-logo-box {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-navy-midnight);
    }
    .category-pills-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 0.75rem;
      margin-top: 1.25rem;
      margin-bottom: 1.5rem;
      -webkit-overflow-scrolling: touch;
    }
    .cat-pill-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--color-border);
      background: var(--color-white);
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .cat-pill-btn:hover {
      border-color: var(--color-flenko-orange);
      color: var(--color-flenko-orange);
    }
    .cat-pill-btn.active {
      background: #fff7ed;
      border-color: var(--color-flenko-orange);
      color: var(--color-flenko-orange);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a href="index.html" class="brand" style="display:flex; align-items:center;">
        <img src="assets/images/logo.png" alt="Flenko" style="height: 42px; width: auto; object-fit: contain;">
      </a>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="window.location.href='index.html'">Back to Home</button>
        <button class="btn btn-orange" onclick="window.location.href='sell.html'" style="font-size:0.85rem;">Register Your Business (Sell on Flenko)</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 5rem;">
    <div class="section-header" style="flex-wrap: wrap; gap: 1rem; align-items: flex-end;">
      <div>
        <h2 class="section-title" style="margin-bottom: 0.25rem;">Worldwide Verified Supplier Directory</h2>
        <p style="color:var(--color-text-muted); font-size: 0.875rem; margin: 0;">Find verified manufacturers, exporters, and suppliers by business category.</p>
      </div>
      
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
        <!-- Category Dropdown Filter -->
        <select id="dirCategorySelect" class="form-control" style="width: 200px; font-weight:600; font-size:0.85rem;">
          <option value="">All Business Sectors</option>
          <option value="Industrial Machinery">⚙️ Industrial Machinery</option>
          <option value="Electrical & Electronics">⚡ Electrical & Electronics</option>
          <option value="Packaging & Printing">📦 Packaging & Printing</option>
          <option value="Chemicals & Dyes">🧪 Chemicals & Dyes</option>
          <option value="Building & Construction">🏗️ Building & Construction</option>
          <option value="Medical & Pharma">💊 Medical & Pharma</option>
          <option value="Textiles & Apparel">🧵 Textiles & Apparel</option>
          <option value="Agriculture & Food">🌾 Agriculture & Food</option>
          <option value="Renewable Energy">☀️ Renewable Energy</option>
          <option value="Automotive & Parts">🚗 Automotive & Parts</option>
          <option value="Metals & Minerals">⚙️ Metals & Minerals</option>
          <option value="Furniture & Decor">🛋️ Furniture & Decor</option>
          <option value="Beauty & Personal Care">🧴 Beauty & Personal Care</option>
          <option value="Hardware & Tools">🔧 Hardware & Tools</option>
          <option value="IT & Telecom">💻 IT, Telecom & Software</option>
          <option value="Safety & Security">🛡️ Safety & Security</option>
          <option value="Gifts & Sports">🧸 Gifts & Sports</option>
          <option value="Logistics & Shipping">🚢 Logistics & Cargo</option>
        </select>

        <div id="directoryCountryContainer"></div>

        <form id="directorySearchForm" style="display: flex; max-width: 260px;">
          <input type="text" id="dirSearchInput" class="form-control" placeholder="Search by name, city..." style="border-radius: var(--radius-md) 0 0 var(--radius-md); font-size:0.85rem;">
          <button type="submit" class="btn btn-primary" style="border-radius: 0 var(--radius-md) var(--radius-md) 0; font-size:0.85rem;">Search</button>
        </form>
      </div>
    </div>

    <!-- Category Quick-Filter Horizontal Pills -->
    <div class="category-pills-bar" id="categoryPills">
      <button type="button" class="cat-pill-btn active" data-cat="">All Categories</button>
      <button type="button" class="cat-pill-btn" data-cat="Industrial Machinery">⚙️ Industrial Machinery</button>
      <button type="button" class="cat-pill-btn" data-cat="Electrical & Electronics">⚡ Electrical & Electronics</button>
      <button type="button" class="cat-pill-btn" data-cat="Packaging & Printing">📦 Packaging & Printing</button>
      <button type="button" class="cat-pill-btn" data-cat="Chemicals & Dyes">🧪 Chemicals & Dyes</button>
      <button type="button" class="cat-pill-btn" data-cat="Building & Construction">🏗️ Building & Construction</button>
      <button type="button" class="cat-pill-btn" data-cat="Medical & Pharma">💊 Medical & Pharma</button>
      <button type="button" class="cat-pill-btn" data-cat="Textiles & Apparel">🧵 Textiles & Apparel</button>
      <button type="button" class="cat-pill-btn" data-cat="Agriculture & Food">🌾 Agriculture & Food</button>
      <button type="button" class="cat-pill-btn" data-cat="Renewable Energy">☀️ Renewable Energy</button>
      <button type="button" class="cat-pill-btn" data-cat="Automotive & Parts">🚗 Automotive & Parts</button>
      <button type="button" class="cat-pill-btn" data-cat="Metals & Minerals">⚙️ Metals & Minerals</button>
      <button type="button" class="cat-pill-btn" data-cat="Furniture & Decor">🛋️ Furniture & Decor</button>
      <button type="button" class="cat-pill-btn" data-cat="Hardware & Tools">🔧 Hardware & Tools</button>
      <button type="button" class="cat-pill-btn" data-cat="IT & Telecom">💻 IT & Telecom</button>
    </div>

    <!-- Active Count Display -->
    <div style="margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--color-text-muted);" id="supplierCountText">
      Showing verified suppliers worldwide
    </div>

    <!-- Suppliers Grid Container -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;" id="supplierDirectoryGrid"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/translator.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("supplierDirectoryGrid");
      const countText = document.getElementById("supplierCountText");
      const searchForm = document.getElementById("directorySearchForm");
      const searchInput = document.getElementById("dirSearchInput");
      const catSelect = document.getElementById("dirCategorySelect");
      const catPills = document.querySelectorAll("#categoryPills .cat-pill-btn");

      let allSuppliers = [];

      // Step 1: Instant Static Suppliers Load from Domain (< 25ms)
      try {
        const staticRes = await fetch('suppliers.json?v=' + Math.floor(Date.now() / 60000));
        if (staticRes.ok) {
          const sList = await staticRes.json();
          if (Array.isArray(sList) && sList.length > 0) {
            allSuppliers = sList.map(b => ({
              id: b.id,
              user_id: b.user_id,
              company_name: b.company_name,
              slug: b.slug,
              category: b.category || "General B2B",
              business_type: b.business_type || "Verified Supplier",
              city: b.city || "Global Hub",
              is_verified: b.is_verified !== false,
              created_at: b.created_at,
              logo_url: b.logo_url
            }));
          }
        }
      } catch(e) {}

      // Step 2: Background Non-Blocking Revalidation (stale-while-revalidate with 2.5s timeout)
      setTimeout(async () => {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2500);
          const res = await fetch(`${window.API_BASE || 'https://flenko-backend.onrender.com/api'}/public/businesses?_t=${Date.now()}`, { signal: controller.signal });
          clearTimeout(timer);
          if (res.ok) {
            const data = await res.json();
            if (data.businesses && data.businesses.length > 0) {
              allSuppliers = data.businesses.map(b => ({
                id: b.id,
                user_id: b.user_id,
                company_name: b.company_name,
                slug: b.slug,
                category: b.category || "General B2B",
                business_type: b.business_type || "Verified Supplier",
                city: b.city || "Global Hub",
                is_verified: b.is_verified !== false,
                created_at: b.created_at,
                logo_url: b.logo_url
              }));
              renderSuppliers();
            }
          }
        } catch(e) {}
      }, 100);

      // Merge locally registered sellers so newly added suppliers never vanish across reboots
      try {
        const registeredUsers = JSON.parse(localStorage.getItem('flenko_registered_users') || '[]');
        const localProfile = JSON.parse(localStorage.getItem('flenko_seller_profile') || '{}');
        const existingNames = new Set(allSuppliers.map(s => (s.company_name || '').toLowerCase().trim()));

        if (localProfile && localProfile.company_name && !/^\d+$/.test(localProfile.company_name.trim())) {
          const lName = localProfile.company_name.toLowerCase().trim();
          if (!existingNames.has(lName)) {
            allSuppliers.unshift({
              id: localProfile.id || localProfile.user_id || 101,
              user_id: localProfile.user_id || 101,
              company_name: localProfile.company_name,
              category: localProfile.category || 'General B2B',
              business_type: localProfile.business_type || 'Manufacturer',
              city: localProfile.city || 'Industrial Hub',
              is_verified: true,
              created_at: new Date().toISOString(),
              logo_url: localProfile.logo_url
            });
            existingNames.add(lName);
          }
        }

        registeredUsers.forEach(u => {
          if (u.role === 'supplier' || u.business || u.company_name) {
            const biz = u.business || {};
            const cName = biz.company_name || u.company_name || u.name;
            if (cName && !/^\d+$/.test(cName.trim()) && cName.toLowerCase() !== 'supplier') {
              const uName = cName.toLowerCase().trim();
              if (!existingNames.has(uName)) {
                allSuppliers.unshift({
                  id: biz.id || u.id || 102,
                  user_id: u.id || 102,
                  company_name: cName,
                  category: biz.category || u.category || 'General B2B',
                  business_type: biz.business_type || 'Manufacturer',
                  city: biz.city || u.city || 'Industrial Hub',
                  is_verified: true,
                  created_at: u.created_at || new Date().toISOString(),
                  logo_url: biz.logo_url || u.logo_url
                });
                existingNames.add(uName);
              }
            }
          }
        });
      } catch(e) {}

      // Check URL query parameters (e.g. ?cat=Industrial+Machinery or ?q=drilling)
      const urlParams = new URLSearchParams(window.location.search);
      const initialCat = urlParams.get('cat') || '';
      const initialQ = urlParams.get('q') || '';
      if (initialQ) {
        searchInput.value = initialQ;
      }
      if (initialCat) {
        catSelect.value = initialCat;
        catPills.forEach(p => {
          p.classList.toggle('active', p.getAttribute('data-cat').toLowerCase() === initialCat.toLowerCase());
        });
      }

      // Initialize Searchable Country Picker
      const countryPicker = new FlenkoCountryPicker({
        container: "#directoryCountryContainer",
        inputName: "dir_country",
        onSelect: () => renderDirectory()
      });

      // Event Listeners
      searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        renderDirectory();
      });

      searchInput.addEventListener("input", () => {
        renderDirectory();
      });

      catSelect.addEventListener("change", () => {
        const selectedVal = catSelect.value;
        catPills.forEach(p => {
          p.classList.toggle('active', p.getAttribute('data-cat').toLowerCase() === selectedVal.toLowerCase());
        });
        renderDirectory();
      });

      catPills.forEach(pill => {
        pill.addEventListener("click", () => {
          const cat = pill.getAttribute("data-cat");
          catSelect.value = cat;
          catPills.forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
          renderDirectory();
        });
      });

      function renderDirectory() {
        const q = searchInput.value.toLowerCase().trim();
        const selCountry = countryPicker.selected;
        const selCategory = catSelect.value.toLowerCase().trim();

        const filtered = allSuppliers.filter(s => {
          // Name / City query filter
          if (q) {
            const matchName = s.company_name.toLowerCase().includes(q);
            const matchCat = s.category.toLowerCase().includes(q);
            const matchCity = s.city.toLowerCase().includes(q);
            if (!matchName && !matchCat && !matchCity) return false;
          }

          // Exact Category filter
          if (selCategory) {
            if (s.category.toLowerCase() !== selCategory) return false;
          }

          // Country filter
          if (selCountry && selCountry.code !== 'ALL') {
            const countryMatch = (s.city && s.city.toLowerCase().includes(selCountry.name.toLowerCase()));
            if (!countryMatch) return false;
          }

          return true;
        });

        countText.textContent = `Showing ${filtered.length} verified suppliers in ${selCategory ? catSelect.value : 'all categories'}`;

        if (filtered.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; padding: 4rem 2rem; text-align: center; background:var(--color-white); border:1px dashed var(--color-border); border-radius:var(--radius-lg);">
              <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🏢</div>
              <h3 style="font-size:1.25rem; font-weight:700; margin-bottom:0.5rem; color:var(--color-navy-midnight);">
                No verified suppliers registered ${selCategory ? 'in ' + catSelect.value : 'yet'}
              </h3>
              <p style="color:var(--color-text-muted); max-width:450px; margin:0 auto 1.5rem; font-size:0.9rem;">
                Are you a manufacturer, exporter, or supplier in this category? Register your business profile on Flenko and start connecting with buyers worldwide.
              </p>
              <button class="btn btn-orange" onclick="window.location.href='sell.html'" style="padding:0.6rem 1.5rem;">
                Register as a Supplier in this Category →
              </button>
            </div>
          `;
          return;
        }

        grid.innerHTML = filtered.map(s => {
          const suppId = s.user_id || s.id || 1;
          const logoHtml = s.logo_url 
            ? `<img src="${s.logo_url}" alt="${s.company_name}" style="width:100%; height:100%; object-fit:contain; padding:2px;">` 
            : `🏢`;

          return `
            <div class="supplier-card">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
                <div class="supplier-logo-box" style="overflow:hidden;">
                  ${logoHtml}
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:0.25rem;">
                  <span class="badge badge-teal">${s.business_type || 'Manufacturer'}</span>
                  <a href="supplier-details.html?id=${suppId}" style="background:#eff6ff; color:#1d4ed8; font-family:monospace; font-size:0.7rem; font-weight:700; padding:1px 6px; border-radius:4px; text-decoration:none; border:1px solid #bfdbfe;" title="Seller ID">
                    #FLK-SUP-${suppId}
                  </a>
                </div>
              </div>
              
              <h3 style="font-size:1.1rem; margin-bottom:0.35rem; color:var(--color-navy-midnight); font-weight:700;">
                <a href="supplier-details.html?id=${suppId}" style="color:inherit; text-decoration:none;" class="hover-underline">
                  ${s.company_name}
                </a>
                <span style="color:var(--color-blue-primary);" title="Verified Global Supplier">✓</span>
              </h3>
              
              <div style="font-size:0.8125rem; color:var(--color-text-muted); margin-bottom:0.75rem;">
                <span>📍 ${s.city || 'Industrial Hub'}</span> &bull; <span style="color:var(--color-teal); font-weight:600;">Verified Storefront</span>
              </div>
              
              <div style="margin-bottom:1rem;">
                <span class="badge badge-blue" style="font-size:0.8rem; padding:0.35rem 0.65rem;">🏷️ Category: ${s.category || 'Industrial Machinery'}</span>
              </div>
              
              <div style="display:flex; gap:0.5rem; margin-top:auto;">
                <button class="btn btn-orange" style="flex:1; font-size:0.8125rem;" onclick="window.location.href='supplier-details.html?id=${suppId}'">
                  View Storefront 🏪
                </button>
                <button class="btn btn-outline" style="flex:1; font-size:0.8125rem;" onclick="window.location.href='rfq.html?supplier=${suppId}&name=${encodeURIComponent(s.company_name)}'">
                  Send RFQ ✉️
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      renderDirectory();
    });
  </script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
