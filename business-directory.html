<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Directory - Flenko.com</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a href="index.html" class="brand" style="display:flex; align-items:center;"><img src="assets/images/logo.png" alt="Flenko" style="height: 45px; width: auto; object-fit: contain;"></a>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="window.location.href='index.html'">Back to Home</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem;">
    <div class="section-header">
      <h2 class="section-title">Verified Supplier Directory</h2>
      <form class="header-search" style="max-width: 400px; margin: 0;">
        <input type="text" class="form-control" placeholder="Search businesses by name, type, or city..." style="border-radius: var(--radius-md) 0 0 var(--radius-md);">
        <button type="submit" class="btn btn-primary" style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">Search</button>
      </form>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
      </div></main>
</body>
</html>
