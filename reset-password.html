<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Flenko.com</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 2.25rem 2rem;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body style="background: var(--color-bg-light); display: flex; flex-direction: column; min-height: 100vh;">
  <header class="site-header">
    <div class="container header-top">
      <a href="index.html" class="brand" style="display:flex; align-items:center;">
        <img src="assets/images/logo.png" alt="Flenko" style="height: 64px; max-height: 70px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));">
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="auth-card">
      
      <!-- Verifying state -->
      <div id="loadingState" style="text-align: center; padding: 2rem 0;">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">⏳</div>
        <p class="text-muted">Verifying your password reset link...</p>
      </div>

      <!-- Invalid / Expired state -->
      <div id="errorState" class="hidden" style="text-align: center; padding: 1rem 0;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem; color: #ef4444;">⚠️</div>
        <h3 style="color: var(--color-navy-deep); margin-bottom: 0.5rem;">Invalid or Expired Link</h3>
        <p id="errorMsgText" class="text-muted" style="font-size: 0.875rem; margin-bottom: 1.5rem;">
          This password reset link is invalid or has expired. Please request a new link.
        </p>
        <a href="login.html" class="btn btn-primary" style="display: inline-block; padding: 0.75rem 1.5rem; background-color: var(--color-teal); border-color: var(--color-teal); text-decoration: none;">
          Back to Login
        </a>
      </div>

      <!-- Reset Password Form -->
      <form id="resetForm" class="hidden">
        <h2 style="margin-bottom: 0.5rem; text-align: center; font-size: 1.5rem; color: var(--color-navy-deep);">Set New Password</h2>
        <p class="text-muted text-center" style="margin-bottom: 1.5rem; font-size: 0.875rem;">
          Enter a secure new password for your Flenko account.
        </p>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="font-weight: 600;">New Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="newPassword" class="form-control" required placeholder="At least 4 characters" minlength="4" style="border-radius: var(--radius-md); padding-right: 42px;">
            <button type="button" onclick="togglePasswordVisibility('newPassword', this)" title="Show password" aria-label="Show password" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #64748b; padding: 4px; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" style="font-weight: 600;">Confirm New Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="confirmPassword" class="form-control" required placeholder="Re-enter new password" minlength="4" style="border-radius: var(--radius-md); padding-right: 42px;">
            <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show password" aria-label="Show password" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #64748b; padding: 4px; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="resetSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600; background-color: var(--color-teal); border-color: var(--color-teal);">
          Update Password & Sign In
        </button>

        <div id="formStatusMsg" class="text-center" style="font-size: 0.875rem; margin-top: 1rem;"></div>
      </form>

    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const resetForm = document.getElementById('resetForm');
    const errorMsgText = document.getElementById('errorMsgText');
    const formStatusMsg = document.getElementById('formStatusMsg');

    async function checkToken() {
      if (!token) {
        loadingState.classList.add('hidden');
        errorState.classList.remove('hidden');
        errorMsgText.innerText = 'No reset token found in link. Please request a new password reset from the login page.';
        return;
      }

      try {
        const res = await auth.verifyResetToken(token);
        loadingState.classList.add('hidden');
        if (res.valid) {
          resetForm.classList.remove('hidden');
        } else {
          errorState.classList.remove('hidden');
          errorMsgText.innerText = res.error || 'Reset link has expired or is invalid.';
        }
      } catch (err) {
        loadingState.classList.add('hidden');
        errorState.classList.remove('hidden');
        errorMsgText.innerText = 'Unable to connect to server. Please try again.';
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value.trim();
      const p2 = document.getElementById('confirmPassword').value.trim();
      const btn = document.getElementById('resetSubmitBtn');

      if (p1 !== p2) {
        formStatusMsg.innerText = 'Passwords do not match. Please re-enter.';
        formStatusMsg.style.color = '#ef4444';
        return;
      }

      formStatusMsg.innerText = 'Updating password...';
      formStatusMsg.style.color = '#64748b';
      btn.disabled = true;

      try {
        const res = await auth.resetPassword({ token, newPassword: p1 });
        if (res.success) {
          auth.setToken(res.token);
          formStatusMsg.innerHTML = '<span style="color: var(--color-teal); font-weight: 600;">✅ Password updated successfully! Logging you in...</span>';
          setTimeout(() => {
            if (res.user && res.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else if (res.user && res.user.role === 'supplier') {
              window.location.href = 'supplier-dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 800);
        } else {
          formStatusMsg.innerText = res.error || 'Failed to reset password.';
          formStatusMsg.style.color = '#ef4444';
          btn.disabled = false;
        }
      } catch (err) {
        formStatusMsg.innerText = 'Server error during password update.';
        formStatusMsg.style.color = '#ef4444';
        btn.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', checkToken);
  </script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
