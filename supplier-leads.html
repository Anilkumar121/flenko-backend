<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages & Leads - Flenko Seller Panel</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { background-color: #f1f3f6; }
    .im-panel-header {
      background: var(--color-white); border-bottom: 2px solid var(--color-navy-deep);
      padding: 0.5rem 0; position: sticky; top: 0; z-index: 100;
    }
    .im-panel-layout {
      display: grid; grid-template-columns: 240px 1fr; gap: 1.5rem;
      padding: 1.5rem 0; max-width: 1350px; margin: 0 auto; height: calc(100vh - 60px);
    }
    .im-sidebar {
      background: var(--color-white); border: 1px solid var(--color-border);
      height: max-content;
    }
    .im-menu a {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem;
      color: var(--color-text-main); font-weight: 500; font-size: 0.875rem;
      border-left: 3px solid transparent; border-bottom: 1px solid var(--color-bg-light);
    }
    .im-menu a:hover, .im-menu a.active {
      background: rgba(22, 119, 210, 0.05); color: var(--color-blue-primary); border-left-color: var(--color-blue-primary);
    }
    
    /* CRM Layout */
    .crm-container {
      display: grid;
      grid-template-columns: 350px 1fr;
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      height: 100%;
    }
    .crm-list {
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      background: var(--color-bg-light);
    }
    .crm-list-header {
      padding: 1rem;
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      position: sticky; top: 0;
    }
    .lead-card {
      padding: 1rem;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      background: var(--color-white);
      transition: background var(--transition-fast);
    }
    .lead-card:hover { background: var(--color-bg-light); }
    .lead-card.active { border-left: 4px solid var(--color-teal); background: #f0fdfa; }
    
    .crm-details {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .crm-details-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .crm-chat-area {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background: #f8fafc;
    }
    .crm-reply-box {
      padding: 1rem;
      border-top: 1px solid var(--color-border);
      background: var(--color-white);
    }
  </style>
</head>
<body>
  <header class="im-panel-header">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1350px;">
      <a href="index.html" class="brand" style="display:flex; align-items:center;"><img src="assets/images/logo.png" alt="Flenko" style="height: 45px; width: auto; object-fit: contain;"></a>
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <button class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="auth.logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="im-panel-layout">
    <aside class="im-sidebar">
      <nav class="im-menu">
        <a href="supplier-dashboard.html">📊 Dashboard</a>
        <a href="supplier-leads.html" class="active">✉️ Messages & Leads</a>
        <a href="supplier-products.html">📋 Manage Products</a>
        <a href="supplier-profile.html">💼 Company Profile</a>
      </nav>
    </aside>

    <section class="crm-container">
      <div class="crm-list">
        <div class="crm-list-header">
          <h3 style="font-size: 1rem; color: var(--color-navy-deep); margin-bottom: 0.5rem;">Inbox (Lead CRM)</h3>
          <input type="text" class="form-control" placeholder="Search leads by phone or product...">
        </div>
        <div id="leadList">
          <div style="padding: 2rem; text-align: center; color: var(--color-text-muted);">Loading leads...</div>
        </div>
      </div>
      
      <div class="crm-details" id="leadDetails">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--color-text-muted);">
          <div style="font-size: 3rem; margin-bottom: 1rem;">✉️</div>
          <h3>Select a lead to view details</h3>
        </div>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    let globalLeads = [];
    document.addEventListener('DOMContentLoaded', async () => {
      const token = auth.getToken();
      if (!token) return window.location.href = 'login.html';

      try {
        const leadsData = await auth.getLeads();
        const listEl = document.getElementById('leadList');
        
        if (leadsData && leadsData.leads && leadsData.leads.length > 0) {
          globalLeads = leadsData.leads;
          listEl.innerHTML = globalLeads.map((lead, index) => `
            <div class="lead-card" onclick="openLead(${index}, this)">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                <span style="font-weight: 600; font-size: 0.875rem; color: var(--color-navy-deep);">${lead.buyer_phone || 'Unknown'}</span>
                <span style="font-size: 0.75rem; color: var(--color-text-muted);">${new Date(lead.created_at || Date.now()).toLocaleDateString()}</span>
              </div>
              <div style="font-size: 0.875rem; font-weight: 500; color: var(--color-blue-primary); margin-bottom: 0.25rem;">${lead.product_needed || 'Product Inquiry'}</div>
              <div style="font-size: 0.75rem; color: var(--color-text-muted);">Status: <span style="color: var(--color-teal); font-weight: 600;">${lead.status || 'New'}</span></div>
            </div>
          `).join('');
        } else {
          listEl.innerHTML = '<div style="padding: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--color-text-muted);">No leads found.</div>';
        }
      } catch (e) {
        document.getElementById('leadList').innerHTML = `<div style="padding: 1.5rem; text-align: center; color: red;">Error loading leads: ${e.message}</div>`;
      }
    });

    function openLead(index, element) {
      document.querySelectorAll('.lead-card').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');
      
      const lead = globalLeads[index];
      const detailsEl = document.getElementById('leadDetails');

      if (lead.locked) {
        detailsEl.innerHTML = `
          <div style="text-align:center; padding: 4rem 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
            <h2 style="color: var(--color-navy-deep); margin-bottom: 1rem;">Unlock Contact Details</h2>
            <p style="color: var(--color-text-muted); margin-bottom: 2rem;">This is a premium/bonus lead or you have consumed your free limit. Pay ₹50 to unlock buyer contact details and requirements.</p>
            
            <div style="display:flex; justify-content:center; gap: 1.5rem; flex-wrap: wrap;">
              <div style="border: 1px solid var(--color-border); padding: 1.5rem; border-radius: var(--radius-md); text-align: center; width: 100%; max-width: 250px;">
                <h3 style="margin-bottom: 0.5rem;">Pay Per Lead</h3>
                <h2 style="color: var(--color-teal); margin-bottom: 1rem;">₹50</h2>
                <button class="btn btn-outline" style="width: 100%;" onclick="payForLead(${lead.id})">Unlock This Lead</button>
              </div>
              <div style="border: 2px solid var(--color-blue-primary); background: rgba(22, 119, 210, 0.05); padding: 1.5rem; border-radius: var(--radius-md); text-align: center; width: 100%; max-width: 250px;">
                <h3 style="margin-bottom: 0.5rem; color: var(--color-blue-primary);">Upgrade Plan</h3>
                <h2 style="color: var(--color-navy-deep); margin-bottom: 0.5rem;">₹10K<span style="font-size:1rem;font-weight:normal;">/yr</span></h2>
                <p style="font-size: 0.75rem; margin-bottom: 1rem; color: var(--color-text-muted);">No Cost EMI Available</p>
                <button class="btn btn-primary" style="width: 100%;" onclick="window.location.href='pricing.html'">View Plans</button>
              </div>
            </div>
          </div>
        `;
        return;
      }
      
      detailsEl.innerHTML = `
        <div class="crm-details-header">
          <div>
            <h2 style="font-size: 1.25rem; color: var(--color-navy-deep); margin-bottom: 0.25rem;">${lead.product_needed}</h2>
            <div style="font-size: 0.875rem; color: var(--color-text-muted);">Buyer Contact: +91-${lead.buyer_phone}</div>
          </div>
          <select class="form-control" id="statusSelect_${lead.id}" style="width: 150px; border-color: var(--color-teal); color: var(--color-teal); font-weight: 600;" onchange="updateStatus(${lead.id}, this.value)">
            <option value="New" ${lead.status==='New'?'selected':''}>🔵 New Lead</option>
            <option value="Contacted" ${lead.status==='Contacted'?'selected':''}>🟡 Contacted</option>
            <option value="Quoted" ${lead.status==='Quoted'?'selected':''}>🟠 Quote Sent</option>
            <option value="Won" ${lead.status==='Won'?'selected':''}>🟢 Deal Won</option>
            <option value="Lost" ${lead.status==='Lost'?'selected':''}>🔴 Deal Lost</option>
          </select>
        </div>
        <div class="crm-chat-area">
          <div style="background: var(--color-white); border: 1px solid var(--color-border); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; max-width: 80%;">
            <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 0.5rem;">Buyer Requirement - ${new Date(lead.created_at).toLocaleString()}</div>
            <p style="font-size: 0.875rem; white-space: pre-wrap;">${lead.details || 'No additional details provided. Please call the buyer to understand requirements.'}</p>
          </div>
        </div>
        <div class="crm-reply-box">
          <form style="display: flex; gap: 1rem;" onsubmit="event.preventDefault(); sendReply(${lead.id}, '${lead.buyer_phone}', '${lead.product_needed}')">
            <input type="text" id="replyInput_${lead.id}" class="form-control" required placeholder="Type your reply... (Sends directly via WhatsApp)">
            <button type="submit" id="replyBtn_${lead.id}" class="btn btn-primary" style="background: var(--color-teal); border-color: var(--color-teal); white-space: nowrap;">Send via WhatsApp</button>
          </form>
        </div>
      `;
    }

    async function payForLead(leadId) {
      const utr = prompt('This lead requires ₹50 to unlock.\nPlease scan the Flenko QR and enter your 12-digit UTR/Reference below to unlock it:');
      if(utr && utr.length >= 10) {
        try {
          const res = await fetch(`/api/leads/${leadId}/pay`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + auth.getToken() }
          });
          const data = await res.json();
          if(data.success) {
            alert("Lead successfully unlocked! " + data.message);
            window.location.reload();
          } else {
            alert('Failed to unlock lead.');
          }
        } catch(e) { alert('Payment failed'); }
      } else if (utr) {
        alert('Invalid UTR. Please provide a valid UPI reference number.');
      }
    }

    async function updateStatus(leadId, newStatus) {
      try {
        const res = await fetch(`/api/leads/${leadId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + auth.getToken()
          },
          body: JSON.stringify({ status: newStatus })
        });
        if(res.ok) {
           // Update local state
           const l = globalLeads.find(x => x.id === leadId);
           if(l) l.status = newStatus;
           // refresh list
           document.getElementById('leadList').innerHTML = globalLeads.map((lead, index) => `
             <div class="lead-card ${lead.id === leadId ? 'active' : ''}" onclick="openLead(${index}, this)">
               <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                 <span style="font-weight: 600; font-size: 0.875rem; color: var(--color-navy-deep);">${lead.buyer_phone}</span>
                 <span style="font-size: 0.75rem; color: var(--color-text-muted);">${new Date(lead.created_at).toLocaleDateString()}</span>
               </div>
               <div style="font-size: 0.875rem; font-weight: 500; color: var(--color-blue-primary); margin-bottom: 0.25rem;">${lead.product_needed}</div>
               <div style="font-size: 0.75rem; color: var(--color-text-muted);">Status: <span style="color: var(--color-teal); font-weight: 600;">${lead.status}</span></div>
             </div>
           `).join('');
        }
      } catch(err) {
        alert('Error updating status');
      }
    }

    async function sendReply(leadId, buyerPhone, productNeeded) {
      const input = document.getElementById(`replyInput_${leadId}`);
      const btn = document.getElementById(`replyBtn_${leadId}`);
      const msg = input.value;
      
      btn.disabled = true;
      btn.innerText = 'Sending...';
      
      try {
        const res = await fetch(`/api/leads/${leadId}/reply`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + auth.getToken()
          },
          body: JSON.stringify({ buyer_phone: buyerPhone, message: msg, product_needed: productNeeded })
        });
        
        const data = await res.json();
        if(data.success) {
          input.value = '';
          btn.innerText = 'Sent! ✅';
          setTimeout(() => { btn.innerText = 'Send via WhatsApp'; btn.disabled = false; }, 2000);
        } else {
          btn.innerText = 'Failed ❌';
          setTimeout(() => { btn.innerText = 'Send via WhatsApp'; btn.disabled = false; }, 2000);
        }
      } catch(e) {
        btn.innerText = 'Error ❌';
        setTimeout(() => { btn.innerText = 'Send via WhatsApp'; btn.disabled = false; }, 2000);
      }
    }
  </script>
</body>
</html>
