<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - Flenko Seller Panel</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { background-color: #f1f3f6; }
    .im-panel-header {
      background: var(--color-white); border-bottom: 2px solid var(--color-navy-deep);
      padding: 0.5rem 0; position: sticky; top: 0; z-index: 100;
    }
    .im-panel-layout {
      display: grid; grid-template-columns: 240px 1fr; gap: 1.5rem;
      padding: 1.5rem 0; max-width: 1350px; margin: 0 auto;
    }
    .im-sidebar {
      background: var(--color-white); border: 1px solid var(--color-border);
      height: max-content; position: sticky; top: 80px;
    }
    .im-menu a {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem;
      color: var(--color-text-main); font-weight: 500; font-size: 0.875rem;
      border-left: 3px solid transparent; border-bottom: 1px solid var(--color-bg-light);
    }
    .im-menu a:hover, .im-menu a.active {
      background: rgba(22, 119, 210, 0.05); color: var(--color-blue-primary); border-left-color: var(--color-blue-primary);
    }
    .panel-card {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); margin-bottom: 1.5rem;
    }
    .panel-card-header {
      padding: 1rem; border-bottom: 1px solid var(--color-border);
      font-weight: 700; font-size: 1.125rem; color: var(--color-navy-deep);
      display: flex; justify-content: space-between; align-items: center;
    }
    .catalog-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem; padding: 1.5rem;
    }
    .product-edit-card {
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      padding: 1rem; text-align: center; background: var(--color-bg-light);
    }
    .product-edit-card img { width: 100%; height: 120px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 1rem; }
    .preset-pill {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .preset-pill:hover {
      background: var(--color-teal);
      color: white;
      border-color: var(--color-teal);
    }
  </style>
</head>
<body>
  <header class="im-panel-header">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1350px;">
      <a href="index.html" class="brand" style="display:flex; align-items:center;"><img src="assets/images/logo.png" alt="Flenko" style="height: 45px; width: auto; object-fit: contain;"></a>
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <button class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="auth.logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="im-panel-layout">
    <aside class="im-sidebar">
      <nav class="im-menu">
        <a href="supplier-dashboard.html">📊 Dashboard</a>
        <a href="supplier-leads.html">✉️ Messages & Leads</a>
        <a href="supplier-products.html" class="active">📋 Manage Products</a>
        <a href="supplier-profile.html">💼 Company Profile</a>
      </nav>
    </aside>

    <section>
      <div class="panel-card">
        <div class="panel-card-header">
          Product Catalog
          <button class="btn btn-primary" onclick="document.getElementById('addProductModal').style.display='flex'">+ Add New Product</button>
        </div>
        <div class="catalog-grid" id="productGrid">
          <div style="padding: 2rem; grid-column: 1 / -1; text-align: center;">Loading catalog...</div>
        </div>
      </div>
    </section>
  </main>

      <h3 style="margin-bottom: 1.5rem;">Add New Product</h3>
      <form id="addProductForm">
        <div class="form-group">
          <label class="form-label">Product Name</label>
          <input type="text" id="pName" class="form-control" required placeholder="e.g. 5-Ply Corrugated Box">
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="pCategory" class="form-control" required>
            <option value="" disabled selected>Select Business Category</option>
            <optgroup label="Manufacturing & Industrial">
              <option>Industrial Machinery</option>
              <option>Packaging Material</option>
              <option>Chemicals & Dyes</option>
              <option>Metal & Hardware</option>
            </optgroup>
            <optgroup label="Construction & Real Estate">
              <option>Building Materials</option>
              <option>Architectural Services</option>
              <option>Interior & Furnishings</option>
            </optgroup>
            <optgroup label="Software & IT Services">
              <option>Web & App Development</option>
              <option>Digital Marketing & SEO</option>
              <option>ERP & Business Software</option>
              <option>Cloud Hosting</option>
            </optgroup>
            <optgroup label="Medical & Hospitality">
              <option>Medical Equipment</option>
              <option>Hospital Furniture</option>
              <option>Surgical Supplies</option>
              <option>Hotel & Restaurant Supplies</option>
            </optgroup>
            <optgroup label="Textile & Apparel">
              <option>Garments & Fabric</option>
              <option>Fashion Accessories</option>
              <option>Yarn & Threads</option>
            </optgroup>
            <optgroup label="Other">
              <option>Agriculture & Food</option>
              <option>Electronics & Electrical</option>
              <option>Printing & Signage</option>
              <option>Uncategorized</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Price (₹) <small style="font-weight: normal; color: #64748b;">(per piece / unit)</small></label>
          <input type="number" id="pPrice" class="form-control" required placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Unit of Measurement & Minimum Order Qty (MOQ)</label>
          <div style="display: flex; gap: 1rem;">
            <input type="number" id="pMoq" class="form-control" required value="1" min="1" style="flex: 1;" placeholder="MOQ">
            <select id="pUnit" class="form-control" style="flex: 1;" required onchange="syncUnitLabels('add')">
              <optgroup label="General / Quantity">
                <option value="Pieces" selected>Pieces</option>
                <option value="Units">Units</option>
                <option value="Sets">Sets</option>
                <option value="Cartons">Cartons</option>
                <option value="Dozens">Dozens</option>
              </optgroup>
              <optgroup label="Construction & Area">
                <option value="Sq. Ft.">Sq. Ft.</option><option value="Sq. Mtr.">Sq. Mtr.</option><option value="Running Ft.">Running Ft.</option><option value="Cubic Mtr.">Cubic Mtr.</option>
              </optgroup>
              <optgroup label="Weight & Mass">
                <option value="Kg">Kg</option><option value="Grams">Grams</option><option value="Tons">Tons</option><option value="Quintals">Quintals</option>
              </optgroup>
              <optgroup label="Length">
                <option value="Meters">Meters</option><option value="Centimeters">Centimeters</option><option value="Inches">Inches</option><option value="Feet">Feet</option>
              </optgroup>
              <optgroup label="Volume & Liquid">
                <option value="Liters">Liters</option><option value="Milliliters">Milliliters</option><option value="Gallons">Gallons</option>
              </optgroup>
              <optgroup label="Services (Hospitality/B2B)">
                <option value="Projects">Projects</option><option value="Man-Days">Man-Days</option><option value="Hours">Hours</option><option value="Contracts">Contracts</option>
              </optgroup>
            </select>
          </div>

            <small style="font-size: 0.72rem; color: #64748b; font-weight: 600;">MOQ Presets:</small>
            <button type="button" class="preset-pill" onclick="setMoqPreset('add', 1)">1</button>
            <button type="button" class="preset-pill" onclick="setMoqPreset('add', 10)">10</button>
            <button type="button" class="preset-pill" onclick="setMoqPreset('add', 50)">50</button>
            <button type="button" class="preset-pill" onclick="setMoqPreset('add', 100)">100</button>
            <button type="button" class="preset-pill" onclick="setMoqPreset('add', 500)">500</button>
            <button type="button" class="preset-pill" onclick="setMoqPreset('add', 1000)">1000+</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Total Available Stock / Quantity</label>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.getToken()) return window.location.href = 'login.html';
      await loadProducts();
    });

    async function loadProducts() {
      const data = await auth.getProducts();
      const grid = document.getElementById('productGrid');
      if (data && data.products && data.products.length > 0) {
        grid.innerHTML = data.products.map(p => `
          <div class="product-edit-card">
            <img src="${p.image_url}" alt="${p.name}">
            <h4 style="font-size: 0.875rem; margin-bottom: 0.25rem;">${p.name}</h4>
            <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 0.25rem;">Price: ₹${p.price} / ${p.unit || 'Pieces'}</div>
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.5rem; gap: 4px;">
              <span style="color: var(--color-teal); font-weight: bold;">MOQ: ${p.moq} ${p.unit || 'Pieces'}</span>
              <span style="color: #2563eb; font-weight: 600;">Stock: ${p.stock_quantity || 500} ${p.unit || 'Pieces'}</span>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-outline" style="flex: 1; font-size: 0.75rem; padding: 0.25rem;" onclick="openEditModal(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price}, ${p.moq}, '${p.unit || 'Pieces'}', '${p.category || 'Uncategorized'}', ${p.stock_quantity || 500})">Edit</button>
              <button class="btn btn-outline" style="flex: 1; font-size: 0.75rem; padding: 0.25rem; color: #e91e63; border-color: #e91e63;" onclick="deleteProduct(${p.id})">Delete</button>
            </div>
          </div>
        `).join('') + `
          <div class="product-edit-card" style="border: 1px dashed var(--color-text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; cursor: pointer;" onclick="document.getElementById('addProductModal').style.display='flex'">
            <div style="font-size: 2rem; color: var(--color-text-muted); margin-bottom: 0.5rem;">+</div>
            <div style="font-size: 0.875rem; font-weight: 600; color: var(--color-navy-deep);">Add More Products</div>
          </div>
        `;
      } else {
        grid.innerHTML = `
          <div class="product-edit-card" style="border: 1px dashed var(--color-text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; cursor: pointer;" onclick="document.getElementById('addProductModal').style.display='flex'">
            <div style="font-size: 2rem; color: var(--color-text-muted); margin-bottom: 0.5rem;">+</div>
            <div style="font-size: 0.875rem; font-weight: 600; color: var(--color-navy-deep);">Add Your First Product</div>
          </div>
        `;
      }
    }

    function setMoqPreset(type, val) {
      const el = document.getElementById(type === 'add' ? 'pMoq' : 'eMoq');
      if (el) el.value = val;
    }

    function setStockPreset(type, val) {
      const el = document.getElementById(type === 'add' ? 'pStock' : 'eStock');
      if (el) el.value = val;
    }

    function syncUnitLabels(type) {
      const unit = document.getElementById(type === 'add' ? 'pUnit' : 'eUnit').value;
      const label = document.getElementById(type === 'add' ? 'pStockUnitLabel' : 'eStockUnitLabel');
      if (label) label.innerText = unit;
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('addBtn');
      btn.innerText = 'Uploading...';
      
      const formData = new FormData();
      formData.append('name', document.getElementById('pName').value);
      formData.append('category', document.getElementById('pCategory').value);
      formData.append('price', document.getElementById('pPrice').value);
      formData.append('moq', document.getElementById('pMoq').value);
      formData.append('unit', document.getElementById('pUnit').value);
      formData.append('stock_quantity', document.getElementById('pStock').value || 500);
      
      const imageFile = document.getElementById('pImage').files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      const res = await auth.addProduct(formData);
      if (res.success) {
        alert('Product Added! Auto-SEO Generated:\n\n' + res.seo_generated);
        document.getElementById('addProductModal').style.display = 'none';
        document.getElementById('addProductForm').reset();
        await loadProducts();
      } else {
        alert('Failed to add product: ' + (res.error || 'Unknown error'));
      }
      btn.innerText = 'Save Product';
    });

    let editingProductId = null;
    function openEditModal(id, name, price, moq, unit, category, stock_quantity) {
      editingProductId = id;
      document.getElementById('eName').value = name;
      document.getElementById('eCategory').value = category || 'Uncategorized';
      document.getElementById('ePrice').value = price;
      document.getElementById('eMoq').value = moq;
      document.getElementById('eUnit').value = unit || 'Pieces';
      document.getElementById('eStock').value = stock_quantity || 500;
      syncUnitLabels('edit');
      document.getElementById('editProductModal').style.display = 'flex';
    }

    document.getElementById('editProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!editingProductId) return;
      const btn = document.getElementById('editBtn');
      btn.innerText = 'Saving...';
      
      const formData = new FormData();
      formData.append('name', document.getElementById('eName').value);
      formData.append('category', document.getElementById('eCategory').value);
      formData.append('price', document.getElementById('ePrice').value);
      formData.append('moq', document.getElementById('eMoq').value);
      formData.append('unit', document.getElementById('eUnit').value);
      formData.append('stock_quantity', document.getElementById('eStock').value || 500);
      
      const imageFile = document.getElementById('eImage').files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      const res = await auth.editProduct(editingProductId, formData);
      if (res.success) {
        document.getElementById('editProductModal').style.display = 'none';
        document.getElementById('editProductForm').reset();
        await loadProducts();
      } else {
        alert('Failed to edit product: ' + (res.error || 'Unknown error'));
      }
      btn.innerText = 'Update Product';
    });
    
    async function deleteProduct(id) {
      if(confirm('Are you sure you want to delete this product?')) {
        try {
          const res = await fetch(`https://flenko-backend.onrender.com/api/products/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${auth.getToken()}` }
          });
          const data = await res.json();
          if(data.success) {
            await loadProducts();
          } else {
            alert('Failed to delete product: ' + (data.error || ''));
          }
        } catch(e) {
          alert('Network Error.');
        }
      }
    }
  </script>

          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Update Product Image (Optional)</label>
          <input type="file" id="eImage" class="form-control" accept="image/*">
        </div>
        <button type="submit" id="editBtn" class="btn btn-primary" style="width: 100%;">Update Product</button>
      </form>
    </div>
  </div>
</body>
</html>
