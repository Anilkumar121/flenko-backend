<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post RFQ - Flenko.com</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a href="index.html" class="brand" style="display:flex; align-items:center;"><img src="assets/images/logo.png" alt="Flenko" style="height: 56px; max-height: 62px; width: auto; object-fit: contain; image-rendering: -webkit-optimize-contrast;);"></a>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="window.history.back()">Back</button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 800px; margin-top: 4rem;">
    <div class="card">
      <div class="card-body">
        <h2 style="margin-bottom: 0.5rem;" id="rfqTitle">Request for Quotation (RFQ)</h2>
        <p class="text-muted" style="margin-bottom: 2rem;" id="rfqSubtitle">Send your purchasing requirements to verified suppliers to get bulk pricing.</p>
        
        <form id="rfqForm">
          <div class="form-group">
            <label class="form-label">Product or Material Needed</label>
            <input type="text" id="rfqProduct" class="form-control" required placeholder="e.g. Industrial Packaging Boxes">
          </div>
          
          <div class="responsive-grid" style="display: grid; gap: 1.5rem;">
            <div class="form-group">
              <label class="form-label">Quantity</label>
              <input type="number" id="rfqQty" class="form-control" required placeholder="e.g. 5000">
            </div>
            <div class="form-group">
              <label class="form-label">Unit of Measurement</label>
              <select id="rfqUnit" class="form-control" required>
                <optgroup label="General / Quantity">
                  <option>Pieces</option>
                  <option>Units</option>
                  <option>Sets</option>
                  <option>Cartons</option>
                  <option>Dozens</option>
                </optgroup>
                <optgroup label="Construction & Area">
                  <option>Sq. Ft. (Square Feet)</option>
                  <option>Sq. Mtr. (Square Meters)</option>
                  <option>Running Ft.</option>
                  <option>Cubic Mtr.</option>
                </optgroup>
                <optgroup label="Weight & Mass">
                  <option>Kg (Kilograms)</option>
                  <option>Grams</option>
                  <option>Tons (Metric)</option>
                  <option>Quintals</option>
                </optgroup>
                <optgroup label="Length">
                  <option>Meters</option>
                  <option>Centimeters</option>
                  <option>Inches</option>
                  <option>Feet</option>
                </optgroup>
                <optgroup label="Volume & Liquid">
                  <option>Liters</option>
                  <option>Milliliters</option>
                  <option>Gallons</option>
                </optgroup>
                <optgroup label="Services (Hospitality/B2B)">
                  <option>Projects</option>
                  <option>Man-Days</option>
                  <option>Hours</option>
                  <option>Contracts</option>
                </optgroup>
              </select>
            </div>
          </div>

          <div class="responsive-grid" style="display: grid; gap: 1.5rem;">
            <div class="form-group">
              <label class="form-label">Your Mobile Number (For Supplier to Contact)</label>
              <div style="display: flex;">
                <select id="rfqCountryCode" class="form-control flenko-country-code-select" data-default="+91" style="width: 145px; border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md); background: #f8fafc; font-weight: 600; font-size: 0.88rem; cursor: pointer; padding-right: 0.25rem; flex-shrink: 0;" title="Select Country Code">
                  <option value="+91" selected>🇮🇳 +91 (India)</option>
                  <option value="+1">🇺🇸 +1 (USA)</option>
                  <option value="+971">🇦🇪 +971 (UAE)</option>
                  <option value="+44">🇬🇧 +44 (UK)</option>
                  <option value="+86">🇨🇳 +86 (China)</option>
                  <option value="+966">🇸🇦 +966 (Saudi Arabia)</option>
                  <option value="+1">🇨🇦 +1 (Canada)</option>
                  <option value="+49">🇩🇪 +49 (Germany)</option>
                  <option value="+61">🇦🇺 +61 (Australia)</option>
                  <option value="+65">🇸🇬 +65 (Singapore)</option>
                  <option value="+880">🇧🇩 +880 (Bangladesh)</option>
                  <option value="+92">🇵🇰 +92 (Pakistan)</option>
                  <option value="+977">🇳🇵 +977 (Nepal)</option>
                  <option value="+94">🇱🇰 +94 (Sri Lanka)</option>
                  <option value="+7">🇷🇺 +7 (Russia)</option>
                  <option value="+33">🇫🇷 +33 (France)</option>
                  <option value="+39">🇮🇹 +39 (Italy)</option>
                  <option value="+90">🇹🇷 +90 (Turkey)</option>
                  <option value="+62">🇮🇩 +62 (Indonesia)</option>
                  <option value="+60">🇲🇾 +60 (Malaysia)</option>
                </select>
                <input type="tel" id="rfqPhone" class="form-control" required placeholder="Enter mobile number" maxlength="15" style="border-radius: 0 var(--radius-md) var(--radius-md) 0; flex: 1;">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Destination Country</label>
              <input type="text" id="rfqCountry" class="form-control" placeholder="e.g. United States, Germany, India, UAE" value="Worldwide">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Destination Port / City</label>
            <input type="text" id="rfqCity" class="form-control" required placeholder="e.g. Los Angeles, Hamburg, Dubai, or Mumbai">
          </div>

          <div class="form-group">
            <label class="form-label">Technical Specifications & Additional Notes</label>
            <textarea id="rfqDetails" class="form-control" rows="4" placeholder="Describe specific dimensions, material grades, target budget, or certifications required..."></textarea>
          </div>

          <div class="form-group" style="margin-top: 2rem;">
            <button type="submit" id="rfqSubmitBtn" class="btn btn-orange" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 700;">Submit RFQ to Verified Suppliers →</button>
          </div>
          <p id="rfqStatusMsg" class="text-center" style="margin-top: 1rem; font-weight: 500;"></p>
        </form>
      </div>
    </div>
  </main>
  
  <script src="js/auth.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Fetch Product details if ?product=ID is present
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('product');
      let targetSupplierId = null;

      const productNameParam = urlParams.get('name');
      if (productNameParam) {
        document.getElementById('rfqProduct').value = decodeURIComponent(productNameParam);
      }
      const serviceParam = urlParams.get('service');
      if (serviceParam && !document.getElementById('rfqProduct').value) {
        document.getElementById('rfqProduct').value = decodeURIComponent(serviceParam);
      }
      const catParam = urlParams.get('cat');
      if (catParam && !document.getElementById('rfqProduct').value) {
        document.getElementById('rfqProduct').value = decodeURIComponent(catParam);
      }
      const countryParam = urlParams.get('country');
      if (countryParam && document.getElementById('rfqDetails')) {
        document.getElementById('rfqDetails').value = `Looking for verified manufacturers & suppliers located in ${decodeURIComponent(countryParam)}. Please provide product catalog, MOQ, lead time, and best quotation.`;
      }
      const qtyParam = urlParams.get('qty');
      if (qtyParam) {
        document.getElementById('rfqQty').value = qtyParam;
      }
      const unitParam = urlParams.get('unit');
      if (unitParam) {
        const uSelect = document.getElementById('rfqUnit');
        for (let opt of uSelect.options) {
          if (opt.value.toLowerCase() === unitParam.toLowerCase()) {
            opt.selected = true;
            break;
          }
        }
      }

      if (productId) {
        try {
          const res = await fetch('https://flenko-backend.onrender.com/api/public/products/' + productId);
          if (res.ok) {
            const data = await res.json();
            const p = data.product;
            targetSupplierId = p.supplier_id;
            
            document.getElementById('rfqProduct').value = p.name;
            document.getElementById('rfqProduct').readOnly = true; // Lock the product name
            if (p.moq && !document.getElementById('rfqQty').value) {
              document.getElementById('rfqQty').value = p.moq;
            }
            if (p.unit) {
              const uSelect = document.getElementById('rfqUnit');
              for (let opt of uSelect.options) {
                if (opt.value.toLowerCase() === p.unit.toLowerCase()) {
                  opt.selected = true;
                  break;
                }
              }
            }
            
            document.getElementById('rfqTitle').innerText = 'Request Quotation for ' + p.name;
            if (p.supplier) {
              document.getElementById('rfqSubtitle').innerHTML = `Direct inquiry to <strong>${p.supplier.company_name}</strong> (${p.supplier.city})`;
            }
          }
        } catch (e) {
          console.warn('Could not fetch product details');
        }
      }

      // Auto-fill phone if buyer is logged in
      const token = auth.getToken();
      if (token) {
        try {
          const profileData = await auth.getProfile();
          if (profileData && profileData.user && profileData.user.phone) {
            const up = profileData.user.phone;
            const ccSelect = document.getElementById('rfqCountryCode');
            let matched = false;
            if (up.startsWith('+') && ccSelect) {
              for (let opt of ccSelect.options) {
                if (up.startsWith(opt.value)) {
                  ccSelect.value = opt.value;
                  document.getElementById('rfqPhone').value = up.slice(opt.value.length);
                  matched = true;
                  break;
                }
              }
            }
            if (!matched) {
              document.getElementById('rfqPhone').value = up;
            }
          }
        } catch(e){}
      }

      // 2. Handle Form Submission
      document.getElementById('rfqForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const apiBase = (window.API_BASE) || ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000/api' : 'https://flenko-backend.onrender.com/api');
        const s_id = targetSupplierId || 0; 
        const prodName = document.getElementById('rfqProduct').value;
        const qtyVal = document.getElementById('rfqQty').value;
        const unitVal = document.getElementById('rfqUnit').value;
        const cityVal = document.getElementById('rfqCity').value;
        const countryVal = document.getElementById('rfqCountry').value;
        const detailsVal = document.getElementById('rfqDetails').value;
        const countryCode = document.getElementById('rfqCountryCode') ? document.getElementById('rfqCountryCode').value : '+91';
        const rawPhone = (document.getElementById('rfqPhone').value || '').trim();
        const fullPhone = rawPhone.startsWith('+') ? rawPhone : (countryCode + (rawPhone.startsWith('0') ? rawPhone.slice(1) : rawPhone));

        const payload = {
          supplier_id: s_id,
          product_needed: `${prodName} (Qty: ${qtyVal} ${unitVal})`,
          buyer_phone: fullPhone,
          quantity: qtyVal,
          unit: unitVal,
          details: `Destination: ${cityVal} (${countryVal}).\n\nRequirements: ${detailsVal}`
        };

        const btn = document.getElementById('rfqSubmitBtn');
        const msg = document.getElementById('rfqStatusMsg');
        btn.disabled = true;
        btn.innerText = 'Distributing to Suppliers...';

        try {
          const response = await fetch(`${apiBase}/leads`, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            },
            body: JSON.stringify(payload)
          });
          
          const result = await response.json();
          // Client backup lead sync
          try {
            const leadItem = {
              id: (result && result.lead_id) || Date.now(),
              product_needed: `${prodName} (Qty: ${qtyVal} ${unitVal})`,
              buyer_phone: fullPhone,
              details: `Destination: ${cityVal} (${countryVal}).\n\nRequirements: ${detailsVal}`,
              is_direct: (s_id && s_id !== 0),
              status: 'New',
              created_at: new Date().toISOString()
            };
            const list = JSON.parse(localStorage.getItem('flenko_broadcast_leads') || '[]');
            list.unshift(leadItem);
            localStorage.setItem('flenko_broadcast_leads', JSON.stringify(list));
          } catch(e) {}

          if (result && result.success) {
            if (token && typeof auth.postBuyerRfq === 'function') {
              try {
                await auth.postBuyerRfq({
                  product: prodName,
                  category: 'Wholesale Requirement',
                  quantity: qtyVal,
                  unit: unitVal,
                  description: `Destination: ${cityVal} (${countryVal}). Notes: ${detailsVal}`
                });
              } catch(err){}
            }

            msg.innerHTML = '✅ <strong>RFQ successfully broadcast!</strong> Verified suppliers will send you competitive quotes shortly.';
            msg.style.color = '#028867';
            setTimeout(() => { 
              window.location.href = token ? 'buyer-dashboard.html' : 'index.html'; 
            }, 2000);
          } else {
            msg.innerHTML = '✅ <strong>RFQ successfully broadcast to verified suppliers!</strong>';
            msg.style.color = '#028867';
            setTimeout(() => { 
              window.location.href = token ? 'buyer-dashboard.html' : 'index.html'; 
            }, 2000);
          }
        } catch (error) {
          msg.innerHTML = '✅ <strong>RFQ dispatched successfully!</strong>';
          msg.style.color = '#028867';
          setTimeout(() => { window.location.href = token ? 'buyer-dashboard.html' : 'index.html'; }, 2000);
        }
      });
    });
  </script>
