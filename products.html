<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worldwide Wholesale Products & Direct Factories - Flenko Global B2B Directory</title>
  <meta name="description" content="Find verified global suppliers, direct manufacturers, and wholesale products across 190+ countries with Trade Assurance order protection.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/storefront.css">
  <link rel="stylesheet" href="css/mobile.css">
  
  <style>
    /* Flenko Sourcing Page Styles */
    .flenko-top-bar {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.78rem;
      color: #64748b;
      padding: 0.35rem 0;
    }
    .flenko-top-bar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .flenko-header {
      background: var(--color-white);
      border-bottom: 1px solid #e2e8f0;
      padding: 0.85rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .flenko-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }
    .flenko-search-box {
      flex: 1;
      max-width: 680px;
      display: flex;
      border: 2px solid var(--color-flenko-orange);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-white);
    }
    .search-type-select {
      background: #f8fafc;
      border: none;
      border-right: 1px solid #e2e8f0;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-navy-midnight);
      cursor: pointer;
      outline: none;
    }
    .flenko-search-input {
      flex: 1;
      border: none;
      padding: 0.6rem 1rem;
      font-size: 0.92rem;
      outline: none;
      color: var(--color-text-main);
    }
    .flenko-search-btn {
      background: var(--color-flenko-orange);
      color: var(--color-white);
      border: none;
      padding: 0 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    /* Fast Filter Bar (Flenko Style) */
    .fast-filter-bar {
      background: var(--color-white);
      border-bottom: 1px solid #e2e8f0;
      padding: 0.65rem 0;
      margin-bottom: 1.25rem;
    }
    .fast-filter-bar .container {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .fast-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      background: var(--color-white);
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }
    .fast-pill-btn:hover {
      border-color: var(--color-flenko-orange);
      color: var(--color-flenko-orange);
    }
    .fast-pill-btn.active {
      background: #fff7ed;
      border-color: var(--color-flenko-orange);
      color: var(--color-flenko-orange);
    }

    /* Layout Sidebar */
    .layout-sidebar {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.75rem;
      align-items: start;
      margin-bottom: 3.5rem;
    }
    .filters-card {
      background: var(--color-white);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 85px;
    }
    .filter-group {
      margin-bottom: 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 1.25rem;
    }
    .filter-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .filter-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-navy-midnight);
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-scroll-list {
      max-height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: #334155;
      margin-bottom: 0.45rem;
      cursor: pointer;
    }
    .checkbox-label input {
      accent-color: var(--color-flenko-orange);
    }

    /* Product Grid */
    .flenko-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }
    .flenko-card {
      background: var(--color-white);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    .flenko-card:hover {
      box-shadow: 0 10px 20px -3px rgba(0,0,0,0.1);
      border-color: #cbd5e1;
      transform: translateY(-3px);
    }
    .flenko-card-img-wrap {
      position: relative;
      aspect-ratio: 1;
      background: #f8fafc;
      overflow: hidden;
    }
    .flenko-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-normal);
    }
    .flenko-card:hover .flenko-card-img {
      transform: scale(1.05);
    }
    .flenko-card-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .flenko-card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.2rem;
    }
    .flenko-card-moq {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.5rem;
    }
    .flenko-card-title {
      font-size: 0.84rem;
      font-weight: 600;
      color: #1e293b;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 0.65rem;
    }
    .flenko-supplier-meta {
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.72rem;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    /* Mobile Drawer */
    .mobile-filter-bar {
      display: none;
      margin-bottom: 1rem;
    }
    @media (max-width: 900px) {
      .layout-sidebar {
        grid-template-columns: 1fr;
      }
      .mobile-filter-bar {
        display: block;
      }
      .filters-card {
        display: none;
      }
      .filters-card.open {
        display: block;
      }
    }
    @media (max-width: 600px) {
      .flenko-product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.85rem;
      }
      .flenko-top-bar {
        display: none;
      }
      .flenko-header-row {
        flex-direction: column;
        gap: 0.75rem;
      }
      .flenko-search-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="flenko-top-bar">
    <div class="container">
      <div>
        <span>Deliver to: </span>
        <div id="topCountryBox" style="display:inline-block;"></div>
      </div>
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <span onclick="window.openFlenkoTranslatorModal()" style="cursor:pointer; display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:4px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);" title="Translate Website into Any Language">
          <span class="flenko-lang-display-flag">🌐</span> <span class="flenko-lang-display-name" style="font-weight:700;">Language</span> ▾
        </span>
        <div id="topBarCurrencyPicker"></div>
        <span style="margin: 0 0.25rem;">|</span>
        <a href="rfq.html" style="color:var(--color-flenko-orange); font-weight:700;">✉️ Submit Buy RFQ</a>
        <span style="margin: 0 0.25rem;">|</span>
        <a href="sell.html">Become a Supplier</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="flenko-header">
    <div class="container flenko-header-row">
      <a href="index.html" class="brand" style="display:flex; align-items:center; gap:0.5rem; text-decoration:none;">
        <img src="assets/images/logo.png" alt="Flenko" style="height: 56px; max-height: 62px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));">
        <span style="font-size:0.65rem; background:#fff7ed; color:var(--color-flenko-orange); font-weight:800; padding:2px 6px; border-radius:4px; border:1px solid #fed7aa; text-transform:uppercase;">
          WHOLESALE
        </span>
      </a>

      <!-- Flenko Search Box -->
      <form class="flenko-search-box" action="products.html" method="GET">
        <select class="search-type-select" name="type">
          <option value="products">Products</option>
          <option value="suppliers">Suppliers</option>
        </select>
        
        <input type="text" name="q" id="pageSearchQuery" class="flenko-search-input" placeholder="Search wholesale products, machinery, chemicals..." autocomplete="off">
        
        <div id="headerCountryContainer"></div>

        <button type="submit" class="flenko-search-btn">
          Search
        </button>
      </form>

      <div class="header-actions">
        <button class="action-item" onclick="window.location.href='index.html'">
          <small>Home</small>
          <strong>Back to Home</strong>
        </button>
        <button class="btn btn-orange" onclick="window.location.href='rfq.html'" style="font-size:0.8125rem; padding:0.5rem 0.85rem;">
          Post RFQ
        </button>
      </div>
    </div>
  </header>

  <!-- Fast Filter Pills Bar (Flenko Style) -->
  <div class="fast-filter-bar">
    <div class="container">
      <span style="font-size:0.8rem; font-weight:700; color:#64748b; margin-right:0.25rem;">Quick Sourcing:</span>
      <button type="button" class="fast-pill-btn" id="pillTradeAssurance">
        🛡️ Trade Assurance
      </button>
      <button type="button" class="fast-pill-btn" id="pillVerifiedPro">
        🏆 Verified Supplier Pro
      </button>
      <button type="button" class="fast-pill-btn" id="pillReadyToShip">
        ⚡ Ready to Ship (≤ 15 days)
      </button>
      <button type="button" class="fast-pill-btn" id="pillLowMoq">
        📦 Low MOQ (≤ 50)
      </button>
      <button type="button" class="btn btn-outline" id="clearAllFiltersBtn" style="padding:0.25rem 0.6rem; font-size:0.75rem; border:none; color:var(--color-flenko-orange); margin-left:auto;">
        Clear All
      </button>
    </div>
  </div>

  <main class="container">
    <!-- Mobile Toggle -->
    <div class="mobile-filter-bar">
      <button type="button" id="mobileFilterToggle" class="btn btn-outline" style="width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--color-white);">
        <span>☰ Filter by Country & Categories</span>
        <span id="mobileBadge" class="badge badge-teal">All Products</span>
      </button>
    </div>

    <div class="layout-sidebar">
      <!-- Left Sourcing Filters -->
      <aside class="filters-card" id="filtersCard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #f1f5f9;">
          <h3 style="font-size:1rem; font-weight:700; color:var(--color-navy-midnight); margin:0;">Filters</h3>
          <span style="font-size:0.75rem; color:#64748b;" id="filterResultsCount">Loading...</span>
        </div>

        <!-- Country Selector -->
        <div class="filter-group">
          <h4 class="filter-title">
            <span>Supplier Country</span>
            <span style="font-size:0.7rem; font-weight:normal; color:#64748b;">190+ Countries</span>
          </h4>
          <div id="sidebarCountryContainer" style="width:100%;"></div>
        </div>

        <!-- Flenko 18 Global Business Categories -->
        <div class="filter-group">
          <h4 class="filter-title">
            <span>Categories</span>
            <span style="font-size:0.72rem; font-weight:normal; color:#64748b;">(18 Sectors)</span>
          </h4>
          <input type="text" id="catFilterInput" class="form-control" placeholder="Search categories..." style="font-size:0.8rem; padding:0.4rem 0.6rem; margin-bottom:0.6rem;">
          
          <div class="category-scroll-list" id="categoryScrollList">
            <label class="checkbox-label">
              <input type="radio" name="businessCat" value="" checked>
              <strong>All Categories</strong>
            </label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Industrial Machinery"><span>⚙️ Industrial Machinery</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Electrical & Electronics"><span>⚡ Electrical & Electronics</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Packaging & Printing"><span>📦 Packaging & Printing</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Chemicals & Dyes"><span>🧪 Chemicals & Raw Materials</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Building & Construction"><span>🏗️ Construction Materials</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Medical & Pharma"><span>💊 Medical & Healthcare</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Textiles & Apparel"><span>🧵 Textiles & Apparel</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Agriculture & Food"><span>🌾 Agriculture & Bulk Food</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Renewable Energy"><span>☀️ Renewable Energy & Solar</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Automotive & Parts"><span>🚗 Vehicle Parts & Accessories</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Metals & Minerals"><span>⚙️ Metals & Metallurgy</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Furniture & Decor"><span>🛋️ Furniture & Commercial Decor</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Hardware & Tools"><span>🔧 Hardware, Fasteners & Tools</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="IT & Telecom"><span>💻 IT, Telecom & Software</span></label>
          </div>
        </div>

        <!-- Supplier Type -->
        <div class="filter-group">
          <h4 class="filter-title">Supplier Verification</h4>
          <label class="checkbox-label">
            <input type="checkbox" id="checkVerifiedOnly">
            <span>Verified Pro Supplier ✓</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="checkTradeAssurance">
            <span>Trade Assurance Protected 🛡️</span>
          </label>
        </div>

        <!-- MOQ -->
        <div class="filter-group">
          <h4 class="filter-title">Min. Order Quantity (MOQ)</h4>
          <div style="display:flex; gap:0.4rem;">
            <input type="number" id="inputMaxMoq" class="form-control" placeholder="Max MOQ (e.g. 100)" style="font-size:0.8rem; padding:0.4rem;">
            <button type="button" id="btnApplyMoq" class="btn btn-secondary" style="padding:0.4rem 0.6rem; font-size:0.75rem;">Set</button>
          </div>
        </div>
      </aside>

      <!-- Products Grid Area -->
      <section style="min-width: 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
          <div>
            <h2 style="font-size:1.35rem; font-weight:800; color:var(--color-navy-midnight); margin:0;">
              Wholesale Sourcing Results
            </h2>
            <span style="font-size:0.8rem; color:#64748b;" id="resultsSubText">Verified global suppliers & manufacturers</span>
          </div>

          <div style="display:flex; align-items:center; gap:0.5rem;">
            <label style="font-size:0.82rem; color:#64748b;">Sort:</label>
            <select id="sortSelector" class="form-control" style="width:160px; font-size:0.82rem; padding:0.35rem 0.6rem;">
              <option value="relevance">Best Match</option>
              <option value="price_low">Price: Low to High</option>
              <option value="price_high">Price: High to Low</option>
              <option value="moq_low">MOQ: Low to High</option>
            </select>
          </div>
        </div>

        <!-- Active Filter Chips -->
        <div id="chipsContainer" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1rem;"></div>

        <!-- Product Grid -->
        <div class="flenko-product-grid" id="productsPageGrid"></div>
      </section>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/categories-data.js"></script>
  <script src="js/inquiry-modal.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/app.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Initialize Top Bar Currency Picker
      if (window.currencyManager) {
        window.currencyManager.renderTopBarPicker('#topBarCurrencyPicker');
        window.addEventListener('flenko_currency_changed', () => {
          if (typeof applyFilters === 'function') applyFilters();
        });
      }

      const grid = document.getElementById("productsPageGrid");
      const chipsContainer = document.getElementById("chipsContainer");
      const resultsSubText = document.getElementById("resultsSubText");
      const filterCountLabel = document.getElementById("filterResultsCount");
      const searchQueryInput = document.getElementById("pageSearchQuery");
      const checkVerified = document.getElementById("checkVerifiedOnly");
      const checkTrade = document.getElementById("checkTradeAssurance");
      const maxMoqInput = document.getElementById("inputMaxMoq");
      const sortSelector = document.getElementById("sortSelector");
      const mobileToggle = document.getElementById("mobileFilterToggle");
      const filtersCard = document.getElementById("filtersCard");
      const categoryScrollList = document.getElementById("categoryScrollList");

      function renderCategorySidebar(activeCat = '') {
        if (!categoryScrollList) return;
        const allCats = typeof FLENKO_CATEGORIES !== 'undefined' ? FLENKO_CATEGORIES : [];
        let customCats = [];
        try {
          customCats = JSON.parse(localStorage.getItem('flenko_custom_categories') || '[]');
        } catch(e) {}

        let html = `
          <label class="checkbox-label">
            <input type="radio" name="businessCat" value="" ${!activeCat ? 'checked' : ''}>
            <strong>All Categories (22+ Industries)</strong>
          </label>
        `;

        allCats.forEach(cat => {
          const isChecked = activeCat && activeCat.toLowerCase() === cat.name.toLowerCase() ? 'checked' : '';
          html += `
            <label class="checkbox-label">
              <input type="radio" name="businessCat" value="${cat.name}" ${isChecked}>
              <span>${cat.icon} ${cat.name}</span>
            </label>
          `;
        });

        if (customCats.length > 0) {
          html += `<div style="font-size:0.7rem; font-weight:700; color:#028867; margin:0.6rem 0 0.3rem; padding-left:0.25rem; text-transform:uppercase;">Custom & Seller Industries</div>`;
          customCats.forEach(cName => {
            const isChecked = activeCat && activeCat.toLowerCase() === cName.toLowerCase() ? 'checked' : '';
            html += `
              <label class="checkbox-label">
                <input type="radio" name="businessCat" value="${cName}" ${isChecked}>
                <span>🏷️ ${cName}</span>
              </label>
            `;
          });
        }

        categoryScrollList.innerHTML = html;
        categoryScrollList.querySelectorAll('input[name="businessCat"]').forEach(r => {
          r.addEventListener('change', applyFilters);
        });
      }

      renderCategorySidebar();

      // Mobile drawer toggle
      mobileToggle.addEventListener("click", () => {
        filtersCard.classList.toggle("open");
      });

      // Quick Pill Buttons (Flenko fast filters)
      const pillTrade = document.getElementById("pillTradeAssurance");
      const pillVerified = document.getElementById("pillVerifiedPro");
      const pillRts = document.getElementById("pillReadyToShip");
      const pillMoq = document.getElementById("pillLowMoq");

      let filterRtsActive = false;
      let filterLowMoqActive = false;

      pillTrade.addEventListener("click", () => {
        checkTrade.checked = !checkTrade.checked;
        pillTrade.classList.toggle("active", checkTrade.checked);
        applyFilters();
      });

      pillVerified.addEventListener("click", () => {
        checkVerified.checked = !checkVerified.checked;
        pillVerified.classList.toggle("active", checkVerified.checked);
        applyFilters();
      });

      pillRts.addEventListener("click", () => {
        filterRtsActive = !filterRtsActive;
        pillRts.classList.toggle("active", filterRtsActive);
        applyFilters();
      });

      pillMoq.addEventListener("click", () => {
        filterLowMoqActive = !filterLowMoqActive;
        pillMoq.classList.toggle("active", filterLowMoqActive);
        if (filterLowMoqActive) maxMoqInput.value = 50;
        else maxMoqInput.value = '';
        applyFilters();
      });

      document.getElementById("clearAllFiltersBtn").addEventListener("click", () => {
        const allCatRadio = document.querySelector('input[name="businessCat"][value=""]');
        if (allCatRadio) allCatRadio.checked = true;
        checkVerified.checked = false;
        checkTrade.checked = false;
        filterRtsActive = false;
        filterLowMoqActive = false;
        pillTrade.classList.remove("active");
        pillVerified.classList.remove("active");
        pillRts.classList.remove("active");
        pillMoq.classList.remove("active");
        maxMoqInput.value = '';
        searchQueryInput.value = '';
        sidebarCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);
        headerCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);
        applyFilters();
      });

      // Initialize Supplier Country Pickers (Search supplier location)
      const sidebarCountryPicker = new FlenkoCountryPicker({
        container: "#sidebarCountryContainer",
        inputName: "s_country",
        storageKey: "flenko_supplier_country",
        defaultCountry: "Worldwide (All Countries)",
        onSelect: (c) => {
          if (headerCountryPicker && headerCountryPicker.selected && headerCountryPicker.selected.code !== c.code) {
            headerCountryPicker.selectCountry(c);
          }
          applyFilters();
        }
      });

      const headerCountryPicker = new FlenkoCountryPicker({
        container: "#headerCountryContainer",
        inputName: "country",
        storageKey: "flenko_supplier_country",
        defaultCountry: "Worldwide (All Countries)",
        onSelect: (c) => {
          if (sidebarCountryPicker && sidebarCountryPicker.selected && sidebarCountryPicker.selected.code !== c.code) {
            sidebarCountryPicker.selectCountry(c);
          }
          applyFilters();
        }
      });

      // Initialize Top Bar "Deliver to" Country Selector (Buyer destination - completely independent)
      new FlenkoCountryPicker({
        container: "#topCountryBox",
        inputName: "top_c",
        storageKey: "flenko_deliver_country",
        defaultCountry: "India"
      });

      // Load real live products from backend
      let allProducts = [];
      const primaryApi = window.API_BASE || 'https://flenko-backend.onrender.com/api';
      const fallbackApi = window.API_FALLBACK || '/api';

      const fetchProductsFrom = async (base) => {
        try {
          const res = await fetch(`${base}/public/products`);
          const ct = (res.headers && res.headers.get('content-type')) || '';
          if (res.ok && !ct.includes('text/html')) {
            const data = await res.json();
            return (data && data.products) ? data.products : [];
          }
        } catch(e) {}
        return null;
      };

      let rawList = await fetchProductsFrom(primaryApi);
      if ((!rawList || rawList.length === 0) && primaryApi !== fallbackApi) {
        const fallbackList = await fetchProductsFrom(fallbackApi);
        if (fallbackList && fallbackList.length > 0) {
          rawList = fallbackList;
        }
      }

      const getCountryFlag = (cName) => {
        if (!cName) return '📍';
        const match = (window.FLENKO_COUNTRIES || []).find(c => c.name.toLowerCase() === cName.toLowerCase() || c.code.toLowerCase() === cName.toLowerCase());
        return match ? match.flag : (cName === 'United States' ? '🇺🇸' : (cName === 'Germany' ? '🇩🇪' : (cName === 'China' ? '🇨🇳' : (cName === 'United Arab Emirates' ? '🇦🇪' : '🇮🇳'))));
      };

      if (rawList && rawList.length > 0) {
        allProducts = rawList.map(p => ({
          id: p.id,
          name: p.name,
          category: p.category || "General B2B",
          country: p.country || "India",
          flag: getCountryFlag(p.country || "India"),
          years: "Verified",
          rating: "5.0",
          reviews: 1,
          supplier: { 
            name: p.supplier_name || ("Verified Supplier #" + p.supplier_id), 
            verified: true, 
            location: (p.city || "Industrial Hub") + (p.country ? ", " + p.country : ", India") 
          },
          supplier_id: p.supplier_id || 1,
          price: (p.price !== null && p.price !== undefined && p.price !== '' && Number(p.price) > 0) ? parseFloat(p.price) : null,
          priceMax: (p.price !== null && p.price !== undefined && p.price !== '' && Number(p.price) > 0) ? (parseFloat(p.price) * 1.15) : null,
          moq: p.moq || 1,
          stock: p.stock_quantity || 500,
          unit: p.unit || "Pieces",
          image: p.image_url || "assets/images/logo.png",
          badge: "VERIFIED PRO",
          tradeAssurance: true,
          responseTime: "Active"
        }));
      }

      // Merge verified default global catalog if backend has 0 products
      const defaultCatalog = [
        {
          id: 'def_101',
          name: "Automatic Rotary Industrial Bakery Oven",
          category: "Bakery Equipment & Food Processing",
          country: "India",
          flag: "🇮🇳",
          supplier: { name: "Apex Thermal Engineering Works", verified: true, location: "Ahmedabad, India" },
          supplier_id: 1,
          price: 385000,
          priceMax: 420000,
          moq: 1,
          stock: 25,
          unit: "Sets",
          image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop&q=80",
          badge: "VERIFIED PRO",
          tradeAssurance: true,
          years: "Verified", rating: "5.0", reviews: 8, responseTime: "Active"
        },
        {
          id: 'def_102',
          name: "Heavy Duty 5-Ply Corrugated Shipping Boxes",
          category: "Industrial Packaging & Boxes",
          country: "India",
          flag: "🇮🇳",
          supplier: { name: "Flenko Kraft Pack Global Ltd", verified: true, location: "New Delhi, India" },
          supplier_id: 1,
          price: 24,
          priceMax: 28,
          moq: 500,
          stock: 25000,
          unit: "Pieces",
          image: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=600&auto=format&fit=crop&q=80",
          badge: "FACTORY DIRECT",
          tradeAssurance: true,
          years: "Verified", rating: "5.0", reviews: 14, responseTime: "Active"
        },
        {
          id: 'def_103',
          name: "Commercial Monocrystalline Solar Panels 550W Tier-1",
          category: "Solar Energy & Renewable Power",
          country: "United States",
          flag: "🇺🇸",
          supplier: { name: "SunVolt Americas Industrial Energy", verified: true, location: "Houston, United States" },
          supplier_id: 1,
          price: 8500,
          priceMax: 9200,
          moq: 20,
          stock: 1200,
          unit: "Units",
          image: "https://images.unsplash.com/photo-1509391365360-2e959784a276?w=600&auto=format&fit=crop&q=80",
          badge: "TOP SUPPLIER",
          tradeAssurance: true,
          years: "Verified", rating: "4.9", reviews: 6, responseTime: "Active"
        },
        {
          id: 'def_104',
          name: "Custom Enterprise B2B Web Application & ERP Software",
          category: "Web Development & IT Services",
          country: "United States",
          flag: "🇺🇸",
          supplier: { name: "CloudMatrix Software Solutions LLC", verified: true, location: "California, United States" },
          supplier_id: 1,
          price: 45000,
          priceMax: 85000,
          moq: 1,
          stock: 100,
          unit: "Projects",
          image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600&auto=format&fit=crop&q=80",
          badge: "VERIFIED PRO",
          tradeAssurance: true,
          years: "Verified", rating: "5.0", reviews: 12, responseTime: "Active"
        },
        {
          id: 'def_105',
          name: "High Precision CNC Lathe Milling Machine",
          category: "Machinery & Industrial Tools",
          country: "Germany",
          flag: "🇩🇪",
          supplier: { name: "Bavaria Precision Machining GMBH", verified: true, location: "Stuttgart, Germany" },
          supplier_id: 1,
          price: 1850000,
          priceMax: 2100000,
          moq: 1,
          stock: 12,
          unit: "Units",
          image: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600&auto=format&fit=crop&q=80",
          badge: "GERMAN VERIFIED",
          tradeAssurance: true,
          years: "Verified", rating: "5.0", reviews: 5, responseTime: "Active"
        },
        {
          id: 'def_106',
          name: "Industrial Grade Stainless Steel Flanges & Valves",
          category: "Metals & Construction Hardware",
          country: "United Arab Emirates",
          flag: "🇦🇪",
          supplier: { name: "Gulf Steel & Pipeline Supplies FZE", verified: true, location: "Dubai, United Arab Emirates" },
          supplier_id: 1,
          price: 1450,
          priceMax: 1800,
          moq: 50,
          stock: 3500,
          unit: "Pieces",
          image: "https://images.unsplash.com/photo-1504917599217-d4dc5ebe6122?w=600&auto=format&fit=crop&q=80",
          badge: "VERIFIED PRO",
          tradeAssurance: true,
          years: "Verified", rating: "4.8", reviews: 9, responseTime: "Active"
        },
        {
          id: 'def_107',
          name: "100% Organic Combed Cotton Yarn & Fabric Rolls",
          category: "Textiles & Apparel Fabrics",
          country: "India",
          flag: "🇮🇳",
          supplier: { name: "Shree Ganesh Textiles Mill Pvt Ltd", verified: true, location: "Surat, India" },
          supplier_id: 1,
          price: 280,
          priceMax: 320,
          moq: 100,
          stock: 8000,
          unit: "Meters",
          image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&auto=format&fit=crop&q=80",
          badge: "FACTORY DIRECT",
          tradeAssurance: true,
          years: "Verified", rating: "5.0", reviews: 18, responseTime: "Active"
        },
        {
          id: 'def_108',
          name: "Industrial Lithium LiFePO4 Energy Storage Battery 48V",
          category: "Electronics & Energy Storage",
          country: "China",
          flag: "🇨🇳",
          supplier: { name: "Shenzhen EverPower Battery Tech Co", verified: true, location: "Shenzhen, China" },
          supplier_id: 1,
          price: 65000,
          priceMax: 72000,
          moq: 5,
          stock: 450,
          unit: "Units",
          image: "https://images.unsplash.com/photo-1558441719-8b489c63f7d1?w=600&auto=format&fit=crop&q=80",
          badge: "TOP SUPPLIER",
          tradeAssurance: true,
          years: "Verified", rating: "4.9", reviews: 7, responseTime: "Active"
        }
      ];

      // Add default catalog items
      const existingNames = new Set(allProducts.map(p => (p.name || '').toLowerCase().trim()));
      defaultCatalog.forEach(dp => {
        if (!existingNames.has(dp.name.toLowerCase().trim())) {
          allProducts.push(dp);
        }
      });

      // Merge locally added seller products and auto-sync to server
      try {
        const localList = JSON.parse(localStorage.getItem('flenko_seller_products') || '[]');
        if (localList.length > 0) {
          const existingIds = new Set(allProducts.map(p => String(p.id)));
          localList.forEach(lp => {
            if (!existingIds.has(String(lp.id))) {
              const pCountry = lp.country || "India";
              allProducts.unshift({
                id: lp.id,
                name: lp.name,
                category: lp.category || "General B2B",
                country: pCountry,
                flag: getCountryFlag(pCountry),
                years: "Verified",
                rating: "5.0",
                reviews: 1,
                supplier: { 
                  name: lp.supplier_name || "Verified Supplier", 
                  verified: true, 
                  location: (lp.city || "Industrial Hub") + ", " + pCountry
                },
                supplier_id: lp.supplier_id || 1,
                price: (lp.price !== null && lp.price !== undefined && lp.price !== '' && Number(lp.price) > 0) ? parseFloat(lp.price) : null,
                priceMax: (lp.price !== null && lp.price !== undefined && lp.price !== '' && Number(lp.price) > 0) ? (parseFloat(lp.price) * 1.15) : null,
                moq: lp.moq || 1,
                stock: lp.stock_quantity || 500,
                unit: lp.unit || "Pieces",
                image: lp.image_url || "assets/images/logo.png",
                badge: "VERIFIED PRO",
                tradeAssurance: true,
                responseTime: "Active"
              });
            }
          });
        }
      } catch(e) {}

      // Register any custom categories present in products
      allProducts.forEach(p => {
        if (p.category && window.registerCustomCategory) {
          window.registerCustomCategory(p.category);
        }
      });

      window.allProductsList = allProducts;

      // URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const qParam = urlParams.get('q');
      const catParam = urlParams.get('cat');
      const countryParam = urlParams.get('country');
      const featParam = urlParams.get('feature');
      const filterParam = urlParams.get('filter');

      if (qParam) searchQueryInput.value = qParam;
      if (featParam === 'trade_assurance') {
        checkTrade.checked = true;
        pillTrade.classList.add("active");
      }
      if (filterParam === 'ready_to_ship') {
        filterRtsActive = true;
        pillRts.classList.add("active");
      }
      if (filterParam === 'verified_pro') {
        checkVerified.checked = true;
        pillVerified.classList.add("active");
      }
      if (catParam) {
        renderCategorySidebar(catParam);
        const targetRadio = document.querySelector(`input[name="businessCat"][value="${catParam}"]`);
        if (targetRadio) targetRadio.checked = true;
      } else {
        renderCategorySidebar();
      }

      if (countryParam) {
        const found = FLENKO_COUNTRIES.find(c => c.name.toLowerCase() === countryParam.toLowerCase() || c.code.toLowerCase() === countryParam.toLowerCase());
        if (found) {
          sidebarCountryPicker.selectCountry(found);
          headerCountryPicker.selectCountry(found);
        }
      }

      // Event listeners
      checkVerified.addEventListener("change", applyFilters);
      checkTrade.addEventListener("change", applyFilters);
      document.getElementById("btnApplyMoq").addEventListener("click", applyFilters);
      sortSelector.addEventListener("change", applyFilters);

      document.getElementById("catFilterInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll("#categoryScrollList .checkbox-label").forEach(l => {
          const val = l.querySelector("input").value;
          if (!val) return;
          l.style.display = l.textContent.toLowerCase().includes(q) ? "flex" : "none";
        });
      });

      function applyFilters() {
        const q = searchQueryInput.value.toLowerCase().trim();
        const selCat = document.querySelector('input[name="businessCat"]:checked')?.value || '';
        const selCountry = sidebarCountryPicker.selected;
        const verifiedOnly = checkVerified.checked;
        const tradeOnly = checkTrade.checked;
        const maxMoq = parseFloat(maxMoqInput.value) || 0;
        const sortVal = sortSelector.value;

        let filtered = allProducts.filter(p => {
          if (q) {
            const m1 = p.name && p.name.toLowerCase().includes(q);
            const m2 = p.category && p.category.toLowerCase().includes(q);
            const m3 = p.supplier && p.supplier.name && p.supplier.name.toLowerCase().includes(q);
            if (!m1 && !m2 && !m3) return false;
          }

          if (selCat) {
            const pCat = (p.category || '').toLowerCase();
            const sCat = selCat.toLowerCase();
            if (pCat !== sCat && !pCat.includes(sCat) && !sCat.includes(pCat)) {
              return false;
            }
          }

          if (selCountry && selCountry.code !== 'ALL') {
            const targetName = (selCountry.name || '').toLowerCase();
            const targetCode = (selCountry.code || '').toLowerCase();
            const prodCountry = (p.country || '').toLowerCase();
            const supLoc = (p.supplier && p.supplier.location ? p.supplier.location.toLowerCase() : '');

            const isUS = targetCode === 'us' || targetName.includes('united states');
            const matchUS = isUS && (prodCountry === 'united states' || prodCountry === 'usa' || prodCountry === 'us' || supLoc.includes('united states') || supLoc.includes('usa'));

            const cMatch = matchUS ||
                           (prodCountry && (prodCountry === targetName || prodCountry === targetCode)) ||
                           (supLoc && (supLoc.includes(targetName) || supLoc.includes(targetCode)));

            if (!cMatch) return false;
          }

          if (verifiedOnly && !p.supplier.verified) return false;
          if (tradeOnly && !p.tradeAssurance) return false;
          if (filterRtsActive && !(p.stock && p.stock > 0)) return false;
          if (filterLowMoqActive && p.moq > 50) return false;
          if (maxMoq > 0 && p.moq > maxMoq) return false;

          return true;
        });

        // Sorting
        if (sortVal === 'price_low') filtered.sort((a,b) => (a.price !== null ? a.price : 999999999) - (b.price !== null ? b.price : 999999999));
        else if (sortVal === 'price_high') filtered.sort((a,b) => (b.price || 0) - (a.price || 0));
        else if (sortVal === 'moq_low') filtered.sort((a,b) => a.moq - b.moq);

        renderList(filtered, { q, selCat, selCountry });
      }

      function renderList(products, filters) {
        resultsSubText.textContent = `Showing ${products.length} verified products with direct factory pricing`;
        filterCountLabel.textContent = `${products.length} items`;
        document.getElementById("mobileBadge").textContent = filters.selCat || (filters.selCountry.code !== 'ALL' ? filters.selCountry.name : 'All Products');

        // Chips
        let chips = '';
        if (filters.q) chips += `<span class="badge badge-gray">Search: "${filters.q}"</span>`;
        if (filters.selCat) chips += `<span class="badge badge-blue">Category: ${filters.selCat}</span>`;
        if (filters.selCountry && filters.selCountry.code !== 'ALL') chips += `<span class="badge badge-teal">Country: ${filters.selCountry.flag} ${filters.selCountry.name}</span>`;
        if (filterRtsActive) chips += `<span class="badge badge-blue">⚡ Ready to Ship</span>`;
        if (filterLowMoqActive) chips += `<span class="badge badge-orange">📦 Low MOQ (≤ 50)</span>`;
        chipsContainer.innerHTML = chips;

        if (products.length === 0) {
          const countryText = (filters.selCountry && filters.selCountry.code !== 'ALL') ? `${filters.selCountry.flag} ${filters.selCountry.name}` : '';
          const qText = filters.q ? `"${filters.q}"` : (filters.selCat ? `category "${filters.selCat}"` : 'wholesale products');
          grid.innerHTML = `
            <div style="grid-column:1/-1; padding:3.5rem 2rem; text-align:center; background:var(--color-white); border:1px dashed #cbd5e1; border-radius:var(--radius-lg);">
              <div style="font-size:3rem; margin-bottom:0.75rem;">🔍</div>
              <h3 style="font-size:1.25rem; font-weight:700; color:#0f172a; margin-bottom:0.5rem;">
                No suppliers found ${countryText ? 'in ' + countryText : ''} for ${qText}
              </h3>
              <p style="color:#64748b; margin-bottom:1.5rem; max-width:540px; margin-left:auto; margin-right:auto; font-size:0.9rem;">
                Looking for ${qText} from ${countryText || 'verified global factories'}? Post your customized Buying Request (RFQ) now and get direct quotations from matching manufacturers within 24 hours.
              </p>
              <div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap;">
                <a href="rfq.html?country=${encodeURIComponent(filters.selCountry && filters.selCountry.code !== 'ALL' ? filters.selCountry.name : '')}&service=${encodeURIComponent(filters.q || filters.selCat || '')}" class="btn btn-orange" style="font-weight:700; padding:0.6rem 1.5rem;">
                  📋 Post Buying Request (RFQ)
                </a>
                <button class="btn btn-secondary" onclick="document.getElementById('clearAllFiltersBtn').click();">Reset Filters</button>
              </div>
            </div>
          `;
          return;
        }

        grid.innerHTML = products.map(p => `
          <article class="flenko-card">
            <div class="flenko-card-img-wrap">
              <img src="${p.image}" alt="${p.name}" class="flenko-card-img" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80'">
              <div style="position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px;">
                ${p.tradeAssurance ? `<span class="badge badge-trade-assurance" style="font-size:0.68rem; padding:2px 6px;">🛡️ Trade Assurance</span>` : ''}
                ${p.badge ? `<span class="badge badge-verified-pro" style="font-size:0.68rem; padding:2px 6px;">${p.badge}</span>` : ''}
              </div>
            </div>
            
            <div class="flenko-card-body">
              <div class="flenko-card-price" style="min-height:28px; display:flex; align-items:center;" onclick="openProductInquiry(${p.id})">
                ${(p.price !== null && p.price !== undefined && p.price !== '' && Number(p.price) > 0)
                  ? `${formatPriceRange(p)} <small style="font-size:0.75rem; font-weight:normal; color:#64748b; margin-left:4px;">/ ${p.unit || 'Pieces'}</small>`
                  : formatPriceRange(p)
                }
              </div>
              
              <div class="flenko-card-moq" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Min. order: <strong>${p.moq} ${p.unit}</strong></span>
                <span style="color:#028867; font-weight:600; font-size:0.72rem;">✓ ${p.stock || 500} ${p.unit} In Stock</span>
              </div>

              <h3 class="flenko-card-title" title="${p.name}">
                ${p.name}
              </h3>

              <div class="flenko-supplier-meta">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-weight:600; color:#1e293b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">
                    ${p.flag || '📍'} ${p.supplier.name}
                  </span>
                  <span style="color:#b45309; font-weight:700;">${p.years || '5 Yrs'}</span>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; color:#94a3b8; font-size:0.7rem;">
                  <span>★ ${p.rating || '4.9'} (${p.reviews || '50+'})</span>
                  <span>⏱️ ${p.responseTime || '≤ 2h'}</span>
                </div>
              </div>

              <div style="display:flex; gap:0.4rem; margin-top:0.75rem;">
                <button class="btn btn-orange" style="flex:1; padding:0.45rem 0.5rem; font-size:0.78rem;" onclick="openProductInquiry(${p.id})">
                  Contact Supplier
                </button>
                <button class="btn btn-secondary" style="padding:0.45rem 0.6rem; font-size:0.78rem; border-color:#cbd5e1;" onclick="openProductInquiry(${p.id})" title="Chat / Send Inquiry">
                  💬
                </button>
              </div>
            </div>
          </article>
        `).join("");
      }

      window.openProductInquiry = function(id) {
        const p = (window.allProductsList || []).find(x => x.id === id);
        if (p && typeof window.openSupplierInquiry === 'function') {
          window.openSupplierInquiry(p);
        } else {
          window.location.href = `rfq.html?product=${id}`;
        }
      };

      applyFilters();
    });
  </script>
