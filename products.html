    /* Full Responsive Layout for Products Page */
    .layout-sidebar {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      margin-top: 1.5rem;
      margin-bottom: 3rem;
      align-items: start;
    }

    .filters-card {
      padding: 1.25rem;
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 80px;
    }

    .filter-group {
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 1.25rem;
    }

    .filter-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .filter-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--color-navy-midnight);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-search-input {
      margin-bottom: 0.75rem;
      font-size: 0.8125rem;
      padding: 0.4rem 0.65rem;
    }

    .category-scroll-list {
      max-height: 250px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 0.25rem;
    }

    .category-scroll-list::-webkit-scrollbar {
      width: 5px;
    }

    .category-scroll-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.84rem;
      color: var(--color-text-main);
      margin-bottom: 0.5rem;
      cursor: pointer;
      user-select: none;
      transition: color var(--transition-fast);
    }

    .checkbox-label:hover {
      color: var(--color-blue-primary);
    }

    .checkbox-label input[type="radio"],
    .checkbox-label input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--color-blue-primary);
      width: 15px;
      height: 15px;
    }

    .mobile-filter-bar {
      display: none;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    .mobile-filter-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      font-weight: 600;
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .active-filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      align-items: center;
    }

    .filter-chip {
      background: rgba(22, 119, 210, 0.1);
      color: var(--color-blue-primary);
      border: 1px solid rgba(22, 119, 210, 0.2);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .filter-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-blue-primary);
      font-size: 0.9rem;
      padding: 0;
      line-height: 1;
    }

    /* Product grid responsive */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    /* Tablet and Mobile Specific Breakpoints */
    @media (max-width: 900px) {
      .layout-sidebar {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-top: 0.5rem;
      }

      .mobile-filter-bar {
        display: block;
      }

      .filters-card {
        display: none; /* Collapsed by default on mobile */
        position: static;
        margin-bottom: 1rem;
      }

      .filters-card.open {
        display: block;
        animation: flenkoFadeIn 0.2s ease-out;
      }

      .section-header {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 0.75rem;
      }

      .section-header > div {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 600px) {
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.875rem;
      }

      .product-info {
        padding: 0.75rem;
      }

      .product-title {
        font-size: 0.8rem;
        line-height: 1.25;
      }

      .product-price {
        font-size: 0.95rem;
      }

      .product-moq {
        font-size: 0.7rem;
      }

      .header-search {
        flex-direction: row;
        width: 100%;
      }
    }
  </style>

      try {
        const res = await fetch('https://flenko-backend.onrender.com/api/public/products');
        if (res.ok) {
          const data = await res.json();
          if (data.products && data.products.length > 0) {
            const liveProducts = data.products.map(p => ({
              id: p.id,
              name: p.name,
              category: p.category || "General B2B",
              country: p.country || "India",
              flag: p.country === "United States" ? "🇺🇸" : (p.country === "Germany" ? "🇩🇪" : "🇮🇳"),
              supplier: { 
                name: "Verified Supplier #" + p.supplier_id, 
                verified: true, 
                location: (p.city || "Pan-India") + (p.country ? ", " + p.country : "") 
              },
              price: p.price,
              moq: p.moq || 1,
              unit: p.unit || "Pieces",
              image: p.image_url || "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80",
              badge: "NEW LISTING",
              leadTime: "Ready to Ship"
            }));
            allProducts = [...liveProducts, ...allProducts];
          }
        }
      } catch (err) {
        console.warn("Live backend products unreachable; using global catalogue", err);
      }

      // Check URL parameters (e.g. ?q=solar&cat=Renewable+Energy&country=United+States)
      const urlParams = new URLSearchParams(window.location.search);
      const initialQuery = urlParams.get('q') || '';
      const initialCat = urlParams.get('cat') || urlParams.get('sub') || '';
      const initialCountry = urlParams.get('country') || '';

      if (initialQuery) {
        document.getElementById('headerSearchQuery').value = initialQuery;
      }

      if (initialCat) {
        // Select matching category radio
        for (const radio of categoryRadios) {
          if (radio.value.toLowerCase() === initialCat.toLowerCase() || initialCat.toLowerCase().includes(radio.value.toLowerCase())) {
            radio.checked = true;
            break;
          }
        }
      }

      if (initialCountry) {
        const found = FLENKO_COUNTRIES.find(c => c.name.toLowerCase() === initialCountry.toLowerCase());
        if (found) {
          sidebarCountryPicker.selectCountry(found);
          headerCountryPicker.selectCountry(found);
        }
      }

      // Category search input filter
      categorySearch.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase().trim();
        document.querySelectorAll("#categoryScrollList .checkbox-label").forEach(label => {
          const radio = label.querySelector("input");
          if (!radio.value) return; // always keep 'All Categories' visible
          const text = (label.textContent + " " + (label.getAttribute("data-name") || "")).toLowerCase();
          label.style.display = text.includes(query) ? "flex" : "none";
        });
      });

      // Filter events
      categoryRadios.forEach(radio => radio.addEventListener("change", applyAllFilters));
      verifiedCheck.addEventListener("change", applyAllFilters);
      manufacturerCheck.addEventListener("change", applyAllFilters);
      document.getElementById("applyMoqBtn").addEventListener("click", applyAllFilters);
      sortBySelect.addEventListener("change", applyAllFilters);

      resetBtn.addEventListener("click", () => {
        document.querySelector('input[name="businessCategory"][value=""]').checked = true;
        sidebarCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);
        headerCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);
        document.getElementById('headerSearchQuery').value = '';
        verifiedCheck.checked = false;
        manufacturerCheck.checked = false;
        maxMoqInput.value = '';
        sortBySelect.value = 'relevance';
        applyAllFilters();
      });

      function applyAllFilters() {
        const query = (document.getElementById('headerSearchQuery').value || '').toLowerCase().trim();
        const selectedRadio = document.querySelector('input[name="businessCategory"]:checked');
        const selectedCat = selectedRadio ? selectedRadio.value : '';
        const selectedCountry = sidebarCountryPicker.selected;
        const isVerifiedOnly = verifiedCheck.checked;
        const maxMoq = parseFloat(maxMoqInput.value) || 0;
        const sortBy = sortBySelect.value;

        let filtered = allProducts.filter(p => {
          // Text Search
          if (query) {
            const matchName = p.name.toLowerCase().includes(query);
            const matchCat = p.category.toLowerCase().includes(query);
            const matchSupplier = p.supplier.name.toLowerCase().includes(query);
            if (!matchName && !matchCat && !matchSupplier) return false;
          }

          // Category filter
          if (selectedCat) {
            if (p.category.toLowerCase() !== selectedCat.toLowerCase()) return false;
          }

          // Country filter
          if (selectedCountry && selectedCountry.code !== "ALL") {
            const countryMatch = (p.country && p.country.toLowerCase() === selectedCountry.name.toLowerCase()) ||
                                 (p.supplier.location && p.supplier.location.toLowerCase().includes(selectedCountry.name.toLowerCase()));
            if (!countryMatch) return false;
          }

          // Verified filter
          if (isVerifiedOnly && !p.supplier.verified) return false;

          // Max MOQ filter
          if (maxMoq > 0 && p.moq > maxMoq) return false;

          return true;
        });

        // Sorting
        if (sortBy === 'price_low') {
          filtered.sort((a, b) => a.price - b.price);
        } else if (sortBy === 'price_high') {
          filtered.sort((a, b) => b.price - a.price);
        } else if (sortBy === 'moq_low') {
          filtered.sort((a, b) => a.moq - b.moq);
        }

        renderProducts(filtered, { query, selectedCat, selectedCountry });
      }

      function renderProducts(products, filters) {
        // Update results counter
        resultsText.textContent = `Showing ${products.length} wholesale products worldwide`;
        
        // Update mobile badge
        const badgeText = filters.selectedCat || (filters.selectedCountry.code !== 'ALL' ? filters.selectedCountry.name : 'All Products');
        document.getElementById("activeFilterBadge").textContent = badgeText;

        // Render Active Filter Chips
        let chipsHtml = '';
        if (filters.query) {
          chipsHtml += `<div class="filter-chip">Search: "${filters.query}" <button onclick="document.getElementById('headerSearchQuery').value=''; applyAllFilters();">×</button></div>`;
        }
        if (filters.selectedCat) {
          chipsHtml += `<div class="filter-chip">Category: ${filters.selectedCat} <button onclick="document.querySelector('input[name=\\'businessCategory\\'][value=\\'\\']').checked=true; applyAllFilters();">×</button></div>`;
        }
        if (filters.selectedCountry && filters.selectedCountry.code !== 'ALL') {
          chipsHtml += `<div class="filter-chip">Country: ${filters.selectedCountry.flag} ${filters.selectedCountry.name} <button onclick="sidebarCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);">×</button></div>`;
        }
        chipsContainer.innerHTML = chipsHtml;

        // Empty state
        if (products.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; padding: 4rem 2rem; text-align: center; background:var(--color-white); border:1px dashed var(--color-border); border-radius:var(--radius-lg);">
              <div style="font-size:3rem; margin-bottom:1rem;">🌐</div>
              <h3 style="font-size:1.25rem; margin-bottom:0.5rem; color:var(--color-navy-midnight);">No wholesale products matched your exact filter</h3>
              <p style="color:var(--color-text-muted); max-width:450px; margin:0 auto 1.5rem;">
                Try choosing "Worldwide (All Countries)" or reset category filters, or post your requirement directly.
              </p>
              <div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('resetFiltersBtn').click();">Reset Filters</button>
                <button type="button" class="btn btn-primary" onclick="window.location.href='rfq.html'" style="background:var(--color-teal); border-color:var(--color-teal);">Post Buy Requirement (RFQ)</button>
              </div>
            </div>
          `;
          return;
        }

        // Render Cards
        grid.innerHTML = products.map(p => `
          <article class="product-card">
            <div class="product-img-wrapper">
              <img src="${p.image}" alt="${p.name}" class="product-img" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80'">
              ${p.badge ? `<div class="product-badges"><span class="badge badge-teal">${p.badge}</span></div>` : ''}
            </div>
            <div class="product-info">
              <div class="product-vendor">
                ${p.supplier.name} ${p.supplier.verified ? '<span style="color:var(--color-blue-primary);" title="Verified Global Supplier">✓</span>' : ''}
              </div>
              <h3 class="product-title" title="${p.name}">${p.name}</h3>
              <div class="product-meta">
                <div>${p.flag || '📍'} ${p.supplier.location || (p.country || 'Worldwide')}</div>
                ${p.leadTime ? `<div>⏱️ Lead: ${p.leadTime}</div>` : ''}
              </div>
              <div class="product-price-row">
                <div>
                  <div class="product-price">${formatCurrency(p.price)} <small style="font-size:0.75rem; font-weight:normal; color:var(--color-text-muted);">/ ${p.unit}</small></div>
                  <div class="product-moq">Min. Order: <strong>${p.moq} ${p.unit}</strong></div>
                </div>
              </div>
              <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                <button class="btn btn-primary" style="flex:1; padding:0.45rem 0.6rem; font-size:0.8125rem;" onclick="window.location.href='rfq.html?product=${p.id}&name=${encodeURIComponent(p.name)}'">
                  Contact Supplier
                </button>
              </div>
            </div>
          </article>
        `).join("");
      }

      // Trigger initial render
      applyAllFilters();
    });
  </script>
</body>
</html>
