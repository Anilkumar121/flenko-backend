<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worldwide Wholesale Products & Direct Factories - Flenko.com (Alibaba-Style Sourcing)</title>
  <meta name="description" content="Find verified global suppliers, direct manufacturers, and wholesale products across 190+ countries with Trade Assurance order protection.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/storefront.css">
  
  <style>
    /* Alibaba Sourcing Page Styles */
    .alibaba-top-bar {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.78rem;
      color: #64748b;
      padding: 0.35rem 0;
    }
    .alibaba-top-bar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .alibaba-header {
      background: var(--color-white);
      border-bottom: 1px solid #e2e8f0;
      padding: 0.85rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .alibaba-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }
    .alibaba-search-box {
      flex: 1;
      max-width: 680px;
      display: flex;
      border: 2px solid var(--color-alibaba-orange);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-white);
    }
    .search-type-select {
      background: #f8fafc;
      border: none;
      border-right: 1px solid #e2e8f0;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-navy-midnight);
      cursor: pointer;
      outline: none;
    }
    .alibaba-search-input {
      flex: 1;
      border: none;
      padding: 0.6rem 1rem;
      font-size: 0.92rem;
      outline: none;
      color: var(--color-text-main);
    }
    .alibaba-search-btn {
      background: var(--color-alibaba-orange);
      color: var(--color-white);
      border: none;
      padding: 0 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    /* Fast Filter Bar (Alibaba Style) */
    .fast-filter-bar {
      background: var(--color-white);
      border-bottom: 1px solid #e2e8f0;
      padding: 0.65rem 0;
      margin-bottom: 1.25rem;
    }
    .fast-filter-bar .container {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .fast-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      background: var(--color-white);
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }
    .fast-pill-btn:hover {
      border-color: var(--color-alibaba-orange);
      color: var(--color-alibaba-orange);
    }
    .fast-pill-btn.active {
      background: #fff7ed;
      border-color: var(--color-alibaba-orange);
      color: var(--color-alibaba-orange);
    }

    /* Layout Sidebar */
    .layout-sidebar {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.75rem;
      align-items: start;
      margin-bottom: 3.5rem;
    }
    .filters-card {
      background: var(--color-white);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 85px;
    }
    .filter-group {
      margin-bottom: 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 1.25rem;
    }
    .filter-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .filter-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-navy-midnight);
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-scroll-list {
      max-height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: #334155;
      margin-bottom: 0.45rem;
      cursor: pointer;
    }
    .checkbox-label input {
      accent-color: var(--color-alibaba-orange);
    }

    /* Product Grid */
    .alibaba-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }
    .alibaba-card {
      background: var(--color-white);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    .alibaba-card:hover {
      box-shadow: 0 10px 20px -3px rgba(0,0,0,0.1);
      border-color: #cbd5e1;
      transform: translateY(-3px);
    }
    .alibaba-card-img-wrap {
      position: relative;
      aspect-ratio: 1;
      background: #f8fafc;
      overflow: hidden;
    }
    .alibaba-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-normal);
    }
    .alibaba-card:hover .alibaba-card-img {
      transform: scale(1.05);
    }
    .alibaba-card-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .alibaba-card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.2rem;
    }
    .alibaba-card-moq {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.5rem;
    }
    .alibaba-card-title {
      font-size: 0.84rem;
      font-weight: 600;
      color: #1e293b;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 0.65rem;
    }
    .alibaba-supplier-meta {
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.72rem;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    /* Mobile Drawer */
    .mobile-filter-bar {
      display: none;
      margin-bottom: 1rem;
    }
    @media (max-width: 900px) {
      .layout-sidebar {
        grid-template-columns: 1fr;
      }
      .mobile-filter-bar {
        display: block;
      }
      .filters-card {
        display: none;
      }
      .filters-card.open {
        display: block;
      }
    }
    @media (max-width: 600px) {
      .alibaba-product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.85rem;
      }
      .alibaba-top-bar {
        display: none;
      }
      .alibaba-header-row {
        flex-direction: column;
        gap: 0.75rem;
      }
      .alibaba-search-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="alibaba-top-bar">
    <div class="container">
      <div>
        <span>Deliver to: </span>
        <div id="topCountryBox" style="display:inline-block;"></div>
      </div>
      <div>
        <a href="rfq.html" style="color:var(--color-alibaba-orange); font-weight:700;">✉️ Submit Buy RFQ</a>
        <span style="margin: 0 0.5rem;">|</span>
        <a href="sell.html">Become a Supplier</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="alibaba-header">
    <div class="container alibaba-header-row">
      <a href="index.html" class="brand" style="display:flex; align-items:center; gap:0.5rem; text-decoration:none;">
        <img src="assets/images/logo.png" alt="Flenko" style="height: 42px; width: auto; object-fit: contain;">
        <span style="font-size:0.65rem; background:#fff7ed; color:var(--color-alibaba-orange); font-weight:800; padding:2px 6px; border-radius:4px; border:1px solid #fed7aa; text-transform:uppercase;">
          WHOLESALE
        </span>
      </a>

      <!-- Alibaba Search Box -->
      <form class="alibaba-search-box" action="products.html" method="GET">
        <select class="search-type-select" name="type">
          <option value="products">Products</option>
          <option value="suppliers">Suppliers</option>
        </select>
        
        <input type="text" name="q" id="pageSearchQuery" class="alibaba-search-input" placeholder="Search wholesale products, machinery, chemicals..." autocomplete="off">
        
        <div id="headerCountryContainer"></div>

        <button type="submit" class="alibaba-search-btn">
          Search
        </button>
      </form>

      <div class="header-actions">
        <button class="action-item" onclick="window.location.href='index.html'">
          <small>Home</small>
          <strong>Back to Home</strong>
        </button>
        <button class="btn btn-orange" onclick="window.location.href='rfq.html'" style="font-size:0.8125rem; padding:0.5rem 0.85rem;">
          Post RFQ
        </button>
      </div>
    </div>
  </header>

  <!-- Fast Filter Pills Bar (Alibaba Style) -->
  <div class="fast-filter-bar">
    <div class="container">
      <span style="font-size:0.8rem; font-weight:700; color:#64748b; margin-right:0.25rem;">Quick Sourcing:</span>
      <button type="button" class="fast-pill-btn" id="pillTradeAssurance">
        🛡️ Trade Assurance
      </button>
      <button type="button" class="fast-pill-btn" id="pillVerifiedPro">
        🏆 Verified Supplier Pro
      </button>
      <button type="button" class="fast-pill-btn" id="pillReadyToShip">
        ⚡ Ready to Ship (≤ 15 days)
      </button>
      <button type="button" class="fast-pill-btn" id="pillLowMoq">
        📦 Low MOQ (≤ 50)
      </button>
      <button type="button" class="btn btn-outline" id="clearAllFiltersBtn" style="padding:0.25rem 0.6rem; font-size:0.75rem; border:none; color:var(--color-alibaba-orange); margin-left:auto;">
        Clear All
      </button>
    </div>
  </div>

  <main class="container">
    <!-- Mobile Toggle -->
    <div class="mobile-filter-bar">
      <button type="button" id="mobileFilterToggle" class="btn btn-outline" style="width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--color-white);">
        <span>☰ Filter by Country & Categories</span>
        <span id="mobileBadge" class="badge badge-teal">All Products</span>
      </button>
    </div>

    <div class="layout-sidebar">
      <!-- Left Sourcing Filters -->
      <aside class="filters-card" id="filtersCard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #f1f5f9;">
          <h3 style="font-size:1rem; font-weight:700; color:var(--color-navy-midnight); margin:0;">Filters</h3>
          <span style="font-size:0.75rem; color:#64748b;" id="filterResultsCount">Loading...</span>
        </div>

        <!-- Country Selector -->
        <div class="filter-group">
          <h4 class="filter-title">
            <span>Supplier Country</span>
            <span style="font-size:0.7rem; font-weight:normal; color:#64748b;">190+ Countries</span>
          </h4>
          <div id="sidebarCountryContainer" style="width:100%;"></div>
        </div>

        <!-- Alibaba 18 Global Business Categories -->
        <div class="filter-group">
          <h4 class="filter-title">
            <span>Categories</span>
            <span style="font-size:0.72rem; font-weight:normal; color:#64748b;">(18 Sectors)</span>
          </h4>
          <input type="text" id="catFilterInput" class="form-control" placeholder="Search categories..." style="font-size:0.8rem; padding:0.4rem 0.6rem; margin-bottom:0.6rem;">
          
          <div class="category-scroll-list" id="categoryScrollList">
            <label class="checkbox-label">
              <input type="radio" name="businessCat" value="" checked>
              <strong>All Categories</strong>
            </label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Industrial Machinery"><span>⚙️ Industrial Machinery</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Electrical & Electronics"><span>⚡ Electrical & Electronics</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Packaging & Printing"><span>📦 Packaging & Printing</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Chemicals & Dyes"><span>🧪 Chemicals & Raw Materials</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Building & Construction"><span>🏗️ Construction Materials</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Medical & Pharma"><span>💊 Medical & Healthcare</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Textiles & Apparel"><span>🧵 Textiles & Apparel</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Agriculture & Food"><span>🌾 Agriculture & Bulk Food</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Renewable Energy"><span>☀️ Renewable Energy & Solar</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Automotive & Parts"><span>🚗 Vehicle Parts & Accessories</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Metals & Minerals"><span>⚙️ Metals & Metallurgy</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Furniture & Decor"><span>🛋️ Furniture & Commercial Decor</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="Hardware & Tools"><span>🔧 Hardware, Fasteners & Tools</span></label>
            <label class="checkbox-label"><input type="radio" name="businessCat" value="IT & Telecom"><span>💻 IT, Telecom & Software</span></label>
          </div>
        </div>

        <!-- Supplier Type -->
        <div class="filter-group">
          <h4 class="filter-title">Supplier Verification</h4>
          <label class="checkbox-label">
            <input type="checkbox" id="checkVerifiedOnly">
            <span>Verified Pro Supplier ✓</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="checkTradeAssurance">
            <span>Trade Assurance Protected 🛡️</span>
          </label>
        </div>

        <!-- MOQ -->
        <div class="filter-group">
          <h4 class="filter-title">Min. Order Quantity (MOQ)</h4>
          <div style="display:flex; gap:0.4rem;">
            <input type="number" id="inputMaxMoq" class="form-control" placeholder="Max MOQ (e.g. 100)" style="font-size:0.8rem; padding:0.4rem;">
            <button type="button" id="btnApplyMoq" class="btn btn-secondary" style="padding:0.4rem 0.6rem; font-size:0.75rem;">Set</button>
          </div>
        </div>
      </aside>

      <!-- Products Grid Area -->
      <section style="min-width: 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
          <div>
            <h2 style="font-size:1.35rem; font-weight:800; color:var(--color-navy-midnight); margin:0;">
              Wholesale Sourcing Results
            </h2>
            <span style="font-size:0.8rem; color:#64748b;" id="resultsSubText">Verified global suppliers & manufacturers</span>
          </div>

          <div style="display:flex; align-items:center; gap:0.5rem;">
            <label style="font-size:0.82rem; color:#64748b;">Sort:</label>
            <select id="sortSelector" class="form-control" style="width:160px; font-size:0.82rem; padding:0.35rem 0.6rem;">
              <option value="relevance">Best Match</option>
              <option value="price_low">Price: Low to High</option>
              <option value="price_high">Price: High to Low</option>
              <option value="moq_low">MOQ: Low to High</option>
            </select>
          </div>
        </div>

        <!-- Active Filter Chips -->
        <div id="chipsContainer" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1rem;"></div>

        <!-- Product Grid -->
        <div class="alibaba-product-grid" id="productsPageGrid"></div>
      </section>
    </div>
  </main>

  <script src="js/countries.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("productsPageGrid");
      const chipsContainer = document.getElementById("chipsContainer");
      const resultsSubText = document.getElementById("resultsSubText");
      const filterCountLabel = document.getElementById("filterResultsCount");
      const searchQueryInput = document.getElementById("pageSearchQuery");
      const catRadios = document.querySelectorAll('input[name="businessCat"]');
      const checkVerified = document.getElementById("checkVerifiedOnly");
      const checkTrade = document.getElementById("checkTradeAssurance");
      const maxMoqInput = document.getElementById("inputMaxMoq");
      const sortSelector = document.getElementById("sortSelector");
      const mobileToggle = document.getElementById("mobileFilterToggle");
      const filtersCard = document.getElementById("filtersCard");

      // Mobile drawer toggle
      mobileToggle.addEventListener("click", () => {
        filtersCard.classList.toggle("open");
      });

      // Quick Pill Buttons (Alibaba fast filters)
      const pillTrade = document.getElementById("pillTradeAssurance");
      const pillVerified = document.getElementById("pillVerifiedPro");
      const pillRts = document.getElementById("pillReadyToShip");
      const pillMoq = document.getElementById("pillLowMoq");

      let filterRtsActive = false;
      let filterLowMoqActive = false;

      pillTrade.addEventListener("click", () => {
        checkTrade.checked = !checkTrade.checked;
        pillTrade.classList.toggle("active", checkTrade.checked);
        applyFilters();
      });

      pillVerified.addEventListener("click", () => {
        checkVerified.checked = !checkVerified.checked;
        pillVerified.classList.toggle("active", checkVerified.checked);
        applyFilters();
      });

      pillRts.addEventListener("click", () => {
        filterRtsActive = !filterRtsActive;
        pillRts.classList.toggle("active", filterRtsActive);
        applyFilters();
      });

      pillMoq.addEventListener("click", () => {
        filterLowMoqActive = !filterLowMoqActive;
        pillMoq.classList.toggle("active", filterLowMoqActive);
        if (filterLowMoqActive) maxMoqInput.value = 50;
        else maxMoqInput.value = '';
        applyFilters();
      });

      document.getElementById("clearAllFiltersBtn").addEventListener("click", () => {
        document.querySelector('input[name="businessCat"][value=""]').checked = true;
        checkVerified.checked = false;
        checkTrade.checked = false;
        filterRtsActive = false;
        filterLowMoqActive = false;
        pillTrade.classList.remove("active");
        pillVerified.classList.remove("active");
        pillRts.classList.remove("active");
        pillMoq.classList.remove("active");
        maxMoqInput.value = '';
        searchQueryInput.value = '';
        sidebarCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);
        headerCountryPicker.selectCountry(FLENKO_COUNTRIES[0]);
        applyFilters();
      });

      // Initialize Country Pickers
      const sidebarCountryPicker = new FlenkoCountryPicker({
        container: "#sidebarCountryContainer",
        inputName: "s_country",
        onSelect: () => applyFilters()
      });

      const headerCountryPicker = new FlenkoCountryPicker({
        container: "#headerCountryContainer",
        inputName: "country",
        onSelect: (c) => sidebarCountryPicker.selectCountry(c)
      });

      new FlenkoCountryPicker({
        container: "#topCountryBox",
        inputName: "top_c",
        onSelect: (c) => sidebarCountryPicker.selectCountry(c)
      });

      // Load products
      let allProducts = [...b2bProducts];

      try {
        const res = await fetch('https://flenko-backend.onrender.com/api/public/products');
        if (res.ok) {
          const data = await res.json();
          if (data.products && data.products.length > 0) {
            const live = data.products.map(p => ({
              id: p.id,
              name: p.name,
              category: p.category || "General B2B",
              country: p.country || "India",
              flag: p.country === "United States" ? "🇺🇸" : (p.country === "Germany" ? "🇩🇪" : "🇮🇳"),
              years: "3 Yrs",
              rating: "4.9",
              reviews: 20,
              supplier: { 
                name: "Verified Factory #" + p.supplier_id, 
                verified: true, 
                location: (p.city || "Pan-India") + (p.country ? ", " + p.country : "") 
              },
              price: p.price,
              priceMax: p.price * 1.15,
              moq: p.moq || 1,
              unit: p.unit || "Pieces",
              image: p.image_url || "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80",
              badge: "VERIFIED PRO",
              tradeAssurance: true,
              responseTime: "≤ 2h"
            }));
            allProducts = [...live, ...allProducts];
          }
        }
      } catch(e) {}

      // URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const qParam = urlParams.get('q');
      const catParam = urlParams.get('cat');
      const countryParam = urlParams.get('country');
      const featParam = urlParams.get('feature');

      if (qParam) searchQueryInput.value = qParam;
      if (featParam === 'trade_assurance') {
        checkTrade.checked = true;
        pillTrade.classList.add("active");
      }
      if (catParam) {
        for (const radio of catRadios) {
          if (radio.value.toLowerCase() === catParam.toLowerCase() || catParam.toLowerCase().includes(radio.value.toLowerCase())) {
            radio.checked = true;
            break;
          }
        }
      }
      if (countryParam) {
        const found = FLENKO_COUNTRIES.find(c => c.name.toLowerCase() === countryParam.toLowerCase());
        if (found) {
          sidebarCountryPicker.selectCountry(found);
          headerCountryPicker.selectCountry(found);
        }
      }

      // Event listeners
      catRadios.forEach(r => r.addEventListener("change", applyFilters));
      checkVerified.addEventListener("change", applyFilters);
      checkTrade.addEventListener("change", applyFilters);
      document.getElementById("btnApplyMoq").addEventListener("click", applyFilters);
      sortSelector.addEventListener("change", applyFilters);

      document.getElementById("catFilterInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll("#categoryScrollList .checkbox-label").forEach(l => {
          const val = l.querySelector("input").value;
          if (!val) return;
          l.style.display = l.textContent.toLowerCase().includes(q) ? "flex" : "none";
        });
      });

      function applyFilters() {
        const q = searchQueryInput.value.toLowerCase().trim();
        const selCat = document.querySelector('input[name="businessCat"]:checked')?.value || '';
        const selCountry = sidebarCountryPicker.selected;
        const verifiedOnly = checkVerified.checked;
        const tradeOnly = checkTrade.checked;
        const maxMoq = parseFloat(maxMoqInput.value) || 0;
        const sortVal = sortSelector.value;

        let filtered = allProducts.filter(p => {
          if (q) {
            const m1 = p.name.toLowerCase().includes(q);
            const m2 = p.category.toLowerCase().includes(q);
            const m3 = p.supplier.name.toLowerCase().includes(q);
            if (!m1 && !m2 && !m3) return false;
          }

          if (selCat && p.category.toLowerCase() !== selCat.toLowerCase()) return false;

          if (selCountry && selCountry.code !== 'ALL') {
            const cMatch = (p.country && p.country.toLowerCase() === selCountry.name.toLowerCase()) ||
                           (p.supplier.location && p.supplier.location.toLowerCase().includes(selCountry.name.toLowerCase()));
            if (!cMatch) return false;
          }

          if (verifiedOnly && !p.supplier.verified) return false;
          if (tradeOnly && !p.tradeAssurance) return false;
          if (maxMoq > 0 && p.moq > maxMoq) return false;

          return true;
        });

        // Sorting
        if (sortVal === 'price_low') filtered.sort((a,b) => a.price - b.price);
        else if (sortVal === 'price_high') filtered.sort((a,b) => b.price - a.price);
        else if (sortVal === 'moq_low') filtered.sort((a,b) => a.moq - b.moq);

        renderList(filtered, { q, selCat, selCountry });
      }

      function renderList(products, filters) {
        resultsSubText.textContent = `Showing ${products.length} verified products with direct factory pricing`;
        filterCountLabel.textContent = `${products.length} items`;
        document.getElementById("mobileBadge").textContent = filters.selCat || (filters.selCountry.code !== 'ALL' ? filters.selCountry.name : 'All Products');

        // Chips
        let chips = '';
        if (filters.q) chips += `<span class="badge badge-gray">Search: "${filters.q}"</span>`;
        if (filters.selCat) chips += `<span class="badge badge-blue">Category: ${filters.selCat}</span>`;
        if (filters.selCountry && filters.selCountry.code !== 'ALL') chips += `<span class="badge badge-teal">Country: ${filters.selCountry.flag} ${filters.selCountry.name}</span>`;
        chipsContainer.innerHTML = chips;

        if (products.length === 0) {
          grid.innerHTML = `
            <div style="grid-column:1/-1; padding:4rem 2rem; text-align:center; background:var(--color-white); border:1px dashed #cbd5e1; border-radius:var(--radius-lg);">
              <div style="font-size:3rem; margin-bottom:0.75rem;">🌐</div>
              <h3>No wholesale products matched this filter</h3>
              <p style="color:#64748b; margin-bottom:1.5rem;">Try choosing "Worldwide (All Countries)" or reset your category search.</p>
              <button class="btn btn-orange" onclick="document.getElementById('clearAllFiltersBtn').click();">Reset Filters</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = products.map(p => `
          <article class="alibaba-card">
            <div class="alibaba-card-img-wrap">
              <img src="${p.image}" alt="${p.name}" class="alibaba-card-img" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80'">
              <div style="position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px;">
                ${p.tradeAssurance ? `<span class="badge badge-trade-assurance" style="font-size:0.68rem; padding:2px 6px;">🛡️ Trade Assurance</span>` : ''}
                ${p.badge ? `<span class="badge badge-verified-pro" style="font-size:0.68rem; padding:2px 6px;">${p.badge}</span>` : ''}
              </div>
            </div>
            
            <div class="alibaba-card-body">
              <div class="alibaba-card-price">
                ${formatPriceRange(p)} <small style="font-size:0.75rem; font-weight:normal; color:#64748b;">/ ${p.unit}</small>
              </div>
              
              <div class="alibaba-card-moq">
                Min. order: <strong>${p.moq} ${p.unit}</strong>
              </div>

              <h3 class="alibaba-card-title" title="${p.name}">
                ${p.name}
              </h3>

              <div class="alibaba-supplier-meta">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-weight:600; color:#1e293b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">
                    ${p.flag || '📍'} ${p.supplier.name}
                  </span>
                  <span style="color:#b45309; font-weight:700;">${p.years || '5 Yrs'}</span>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; color:#94a3b8; font-size:0.7rem;">
                  <span>★ ${p.rating || '4.9'} (${p.reviews || '50+'})</span>
                  <span>⏱️ ${p.responseTime || '≤ 2h'}</span>
                </div>
              </div>

              <div style="display:flex; gap:0.4rem; margin-top:0.75rem;">
                <button class="btn btn-orange" style="flex:1; padding:0.45rem 0.5rem; font-size:0.78rem;" onclick="window.location.href='rfq.html?product=${p.id}&name=${encodeURIComponent(p.name)}'">
                  Contact Supplier
                </button>
                <button class="btn btn-secondary" style="padding:0.45rem 0.6rem; font-size:0.78rem; border-color:#cbd5e1;" onclick="window.location.href='rfq.html?product=${p.id}&name=${encodeURIComponent(p.name)}'" title="Chat / Send Inquiry">
                  💬
                </button>
              </div>
            </div>
          </article>
        `).join("");
      }

      applyFilters();
    });
  </script>
</body>
</html>
