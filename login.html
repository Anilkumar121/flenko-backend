<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Flenko.com</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: 1.5rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      color: var(--color-teal);
      border-bottom-color: var(--color-teal);
    }
    .auth-footer-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }
    .auth-footer-link a {
      color: var(--color-teal);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body style="background: var(--color-bg-light); display: flex; flex-direction: column; min-height: 100vh;">
  <header class="site-header">
    <div class="container header-top">
      <a href="index.html" class="brand" style="display:flex; align-items:center;"><img src="assets/images/logo.png" alt="Flenko" style="height: 45px; width: auto; object-fit: contain;"></a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: var(--radius-lg);">
      
      <!-- Auth Switcher Tabs -->
      <div class="auth-tabs">
        <button type="button" id="tabSignIn" class="auth-tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
        <button type="button" id="tabSignUp" class="auth-tab-btn" onclick="switchAuthTab('register')">Create Buyer Account</button>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="font-weight: 600;">Mobile Number</label>
          <div style="display: flex;">
            <span class="form-control" style="width: auto; border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md); background: #f1f5f9; font-weight: 500;">🇮🇳 +91</span>
            <input type="tel" id="loginPhone" class="form-control" required placeholder="10-digit number" pattern="[0-9]{10}" style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 0.5rem;">
          <label class="form-label" style="font-weight: 600;">Password</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="Enter password" style="border-radius: var(--radius-md);">
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 1.25rem;">
          <a href="javascript:void(0)" onclick="switchAuthTab('forgot')" style="font-size: 0.8rem; color: var(--color-teal); text-decoration: none; font-weight: 500;">Forgot Password?</a>
        </div>
        
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600; background-color: var(--color-teal); border-color: var(--color-teal);">Sign In</button>
      </form>

      <!-- Forgot Password Form -->
      <form id="forgotForm" class="hidden">
        <h3 style="margin-bottom: 0.35rem; font-size: 1.15rem; color: var(--color-navy-deep); text-align: center;">Reset Your Password</h3>
        <p class="text-muted text-center" style="font-size: 0.85rem; margin-bottom: 1.25rem;">
          Enter your registered Email address (or Mobile Number) and we will send you a password reset link.
        </p>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="font-weight: 600;">Email or Mobile Number</label>
          <input type="text" id="forgotIdentifier" class="form-control" required placeholder="e.g. name@example.com or 10-digit mobile" style="border-radius: var(--radius-md);">
        </div>

        <button type="submit" id="forgotSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600; background-color: var(--color-teal); border-color: var(--color-teal);">Send Reset Link to Email</button>

        <div style="text-align: center; margin-top: 1rem;">
          <a href="javascript:void(0)" onclick="switchAuthTab('login')" style="font-size: 0.85rem; color: #64748b; text-decoration: none;">&larr; Back to Sign In</a>
        </div>
      </form>

      <!-- Create Buyer Account Form -->
      <form id="registerForm" class="hidden">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" style="font-weight: 600;">Full Name</label>
          <input type="text" id="regName" class="form-control" required placeholder="e.g. Rahul Sharma" style="border-radius: var(--radius-md);">
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" style="font-weight: 600;">Mobile Number</label>
          <div style="display: flex;">
            <span class="form-control" style="width: auto; border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md); background: #f1f5f9; font-weight: 500;">🇮🇳 +91</span>
            <input type="tel" id="regPhone" class="form-control" required placeholder="10-digit number" pattern="[0-9]{10}" style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" style="font-weight: 600;">Create Password</label>
          <input type="password" id="regPassword" class="form-control" required placeholder="At least 4 characters" minlength="4" style="border-radius: var(--radius-md);">
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600; background-color: var(--color-teal); border-color: var(--color-teal);">Create Free Buyer Account</button>
      </form>

      <!-- Status Feedback -->
      <div id="statusMsg" class="text-center" style="font-size: 0.875rem; margin-top: 1rem; min-height: 1.25rem;"></div>

      <div class="auth-footer-link" style="border-top: 1px solid var(--color-border); padding-top: 1rem; margin-top: 1.5rem;">
        Are you a manufacturer or supplier? <br>
        <a href="sell.html">Register as a Seller &rarr;</a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const forgotForm = document.getElementById('forgotForm');
    const tabSignIn = document.getElementById('tabSignIn');
    const tabSignUp = document.getElementById('tabSignUp');
    const statusMsg = document.getElementById('statusMsg');

    function switchAuthTab(tab) {
      statusMsg.innerText = '';
      if (tab === 'login') {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        forgotForm.classList.add('hidden');
      } else if (tab === 'register') {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        forgotForm.classList.add('hidden');
      } else if (tab === 'forgot') {
        tabSignIn.classList.remove('active');
        tabSignUp.classList.remove('active');
        forgotForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        registerForm.classList.add('hidden');
      }
    }

    // Handle Forgot Password
    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = document.getElementById('forgotIdentifier').value.trim();
      const btn = document.getElementById('forgotSubmitBtn');
      const payload = val.includes('@') ? { email: val } : { phone: val.replace(/[^0-9]/g, '').slice(-10) };

      statusMsg.innerText = 'Generating reset link...';
      statusMsg.style.color = '#64748b';
      btn.disabled = true;

      try {
        const res = await auth.forgotPassword(payload);
        if (res.success) {
          statusMsg.innerHTML = `
            <div style="color: var(--color-teal); font-weight: 500; margin-bottom: 0.5rem;">
              ✅ ${res.message}
            </div>
            ${res._resetUrl ? `<a href="${res._resetUrl}" target="_blank" class="btn btn-outline" style="display:inline-block; margin-top:8px; padding:6px 14px; font-size:0.8rem; border-color:var(--color-teal); color:var(--color-teal);">🔗 Open Password Reset Link</a>` : ''}
          `;
          btn.disabled = false;
        } else {
          statusMsg.innerText = res.error || 'Failed to send reset link.';
          statusMsg.style.color = '#ef4444';
          btn.disabled = false;
        }
      } catch (err) {
        statusMsg.innerText = 'Server error. Please try again.';
        statusMsg.style.color = '#ef4444';
        btn.disabled = false;
      }
    });

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.replace(/[^0-9]/g, '').slice(-10);
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('loginSubmitBtn');

      statusMsg.innerText = 'Signing in...';
      statusMsg.style.color = '#64748b';
      btn.disabled = true;

      try {
        const res = await auth.login(phone, password);
        if (res.success) {
          auth.setToken(res.token);
          statusMsg.innerText = 'Login successful! Redirecting...';
          statusMsg.style.color = 'var(--color-teal)';
          setTimeout(() => {
            if (res.user && res.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else if (res.user && res.user.role === 'supplier') {
              window.location.href = 'supplier-dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 400);
        } else {
          statusMsg.innerText = res.error || 'Login failed. Please check mobile and password.';
          statusMsg.style.color = '#ef4444';
          btn.disabled = false;
        }
      } catch (err) {
        statusMsg.innerText = 'Server connection error. Please try again.';
        statusMsg.style.color = '#ef4444';
        btn.disabled = false;
      }
    });

    // Handle Buyer Registration
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.replace(/[^0-9]/g, '').slice(-10);
      const password = document.getElementById('regPassword').value.trim();
      const btn = document.getElementById('regSubmitBtn');

      statusMsg.innerText = 'Creating account...';
      statusMsg.style.color = '#64748b';
      btn.disabled = true;

      try {
        const res = await auth.register({
          name,
          phone,
          password,
          isSellerRegistration: false
        });

        if (res.success) {
          auth.setToken(res.token);
          statusMsg.innerText = 'Account created successfully! Redirecting...';
          statusMsg.style.color = 'var(--color-teal)';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 400);
        } else {
          statusMsg.innerText = res.error || 'Registration failed.';
          statusMsg.style.color = '#ef4444';
          btn.disabled = false;
        }
      } catch (err) {
        statusMsg.innerText = 'Server error during registration.';
        statusMsg.style.color = '#ef4444';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
