<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout - Flenko B2B</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    body { background-color: #f8f9fa; }
    .checkout-container { max-width: 900px; margin: 4rem auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; }
    .checkout-card { background: white; padding: 2rem; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); }
    .payment-options { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    .pay-option { border: 1px solid var(--color-border); padding: 1rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: all 0.2s; }
    .pay-option:hover, .pay-option.active { border-color: var(--color-teal); background: rgba(22,133,107,0.05); }
    .pay-option input { transform: scale(1.2); cursor: pointer; }
    
    .order-summary { background: var(--color-navy-deep); color: white; padding: 2rem; border-radius: var(--radius-md); }
    .order-summary h3 { color: white; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.875rem; color: rgba(255,255,255,0.8); }
    .summary-total { display: flex; justify-content: space-between; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed rgba(255,255,255,0.3); font-size: 1.25rem; font-weight: 700; color: white; }
    
    .processing-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.9); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--color-teal); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 2rem auto; }
    }
  </style>
</head>
<body>
  <header class="site-header" style="box-shadow: none; border-bottom: 1px solid var(--color-border);">
    <div class="container header-top" style="justify-content: center;">
      <a href="index.html"><img src="assets/images/logo.png" alt="Flenko" style="height: 40px; width: auto; object-fit: contain;"></a>
    </div>
  </header>

  <main class="container checkout-container">
    <div class="checkout-card">
      <h2 style="color: var(--color-navy-deep); margin-bottom: 0.5rem;">Select Payment Method</h2>
      <p class="text-muted" style="margin-bottom: 2rem;">All transactions are secure and encrypted.</p>
      
      <div class="payment-options">
        <label class="pay-option active">
          <input type="radio" name="payment" checked>
          <div style="flex: 1;">
            <strong>UPI / QR Code (Only)</strong>
            <div style="font-size: 0.75rem; color: var(--color-text-muted);">GPay, PhonePe, Paytm, BHIM</div>
          </div>
          <span style="font-size: 1.5rem;">📱</span>
        </label>
      </div>

      <div style="margin-top: 1.5rem; text-align: center; border: 1px dashed var(--color-border); padding: 1.5rem; border-radius: var(--radius-sm); background: #fff;">
        <p style="font-size: 1rem; color: var(--color-navy-deep); font-weight: 700; margin-bottom: 1rem;">Scan QR to Pay <span id="displayTotal" style="color: var(--color-teal);"></span></p>
        <img src="assets/images/payment_qr.png" alt="Payment QR Code" style="max-width: 250px; margin: 0 auto; display: block; border: 2px solid var(--color-border); border-radius: 8px;">
      </div>

      <div style="margin-top: 1.5rem;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Enter UTR / UPI Reference No. (12 Digits) *</label>
        <input type="text" id="utrNumber" class="form-control" placeholder="e.g. 123456789012" maxlength="12" style="width: 100%; font-size: 1rem; letter-spacing: 1px;">
        <small style="color: var(--color-text-muted); font-size: 0.75rem; display: block; margin-top: 0.25rem;">We will verify your payment using this UTR number.</small>
      </div>

      <div style="margin-top: 2rem;">
        <button class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.125rem; background: var(--color-teal); border: none; font-weight: 700;" onclick="processPayment()">I Have Paid, Verify Now</button>
      </div>
    </div>

    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Plan Selection</span>
        <strong id="planName" style="color: white; text-transform: capitalize;">Loading...</strong>
      </div>
      <div class="summary-total">
        <span>Total Payable</span>
        <span id="totalPrice">₹0</span>
      </div>
      <p style="font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 2rem; text-align: center;">Powered by SecurePay (Mock)</p>
    </div>
  </main>

  <div class="processing-overlay" id="overlay">
    <div class="spinner"></div>
    <h3 style="color: var(--color-navy-deep);">Processing Payment...</h3>
    <p style="color: var(--color-text-muted);">Please do not refresh or close this window.</p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function selectOption(el) {
      document.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('active'));
      el.classList.add('active');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const plan = urlParams.get('plan') || 'basic';
    
    let base = 0;
    let displayName = plan + " Premium";
    if (plan === 'basic') {
      base = 10000;
      displayName = "Basic Supplier Plan";
    } else if (plan === 'pro') {
      base = 20000;
      displayName = "Pro Standard Plan";
    } else if (plan === 'enterprise') {
      base = 30000;
      displayName = "Enterprise Growth Plan";
    } else if (plan === 'website_combo') {
      base = 35000;
      displayName = "Custom Business Website + VIP Growth Plan";
    }
    
    const total = base;
    
    document.getElementById('planName').innerText = displayName;
    document.getElementById('totalPrice').innerText = '₹' + total.toLocaleString();
    document.getElementById('displayTotal').innerText = '(₹' + total.toLocaleString() + ')';

    async function processPayment() {
      if(!auth.getToken()) {
        alert('Please log in first to activate your membership plan.');
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }

      const utr = document.getElementById('utrNumber').value.trim();
      if(!utr || utr.length !== 12 || isNaN(utr)) {
        alert('Please enter a valid 12-digit UTR or Reference Number provided by your UPI app after payment.');
        return;
      }
      
      const overlay = document.getElementById('overlay');
      overlay.style.display = 'flex';
      overlay.querySelector('h3').innerText = 'Verifying UTR: ' + utr;
      overlay.querySelector('p').innerText = 'Contacting payment gateway... This may take up to 5 seconds.';
      
      // Verification
      setTimeout(async () => {
        try {
          const res = await auth.fetchWithFallback('/subscriptions/upgrade', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + auth.getToken()
            },
            body: JSON.stringify({ plan, utr })
          });
          const data = await res.json();
          if(data.success) {
            alert('🎉 Payment Verified Successfully! Your supplier account has been upgraded to ' + displayName);
            window.location.href = 'supplier-dashboard.html';
          } else {
            alert('Notice: ' + (data.message || 'Payment received and submitted for verification. Welcome!'));
            window.location.href = 'supplier-dashboard.html';
          }
        } catch(e) {
          alert('🎉 Payment submitted successfully! Welcome to Flenko VIP Supplier.');
          window.location.href = 'supplier-dashboard.html';
        }
      }, 2000);
    }
  </script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
